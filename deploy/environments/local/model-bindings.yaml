apiVersion: sre.ai/v1alpha1
kind: ModelBindings
environment: local
# Local Ollama through the OpenAI-compatible path. The endpoint is supplied by
# the compose file, not rendered, so this file stays credential-free.
profiles:
  manager-router:
    provider: ollama
    model: qwen3:8b
  tool-caller:
    provider: ollama
    model: qwen3:8b
  tier-l-synthesis:
    provider: ollama
    model: qwen3:8b
  # PLATFORM profile, not an Agent's. It backs console assistance such as
  # drafting a system prompt, and is bound here like any other profile so an
  # air-gapped deployment resolves it to the same internal endpoint as the rest.
  prompt-assist:
    provider: ollama
    model: qwen3:8b
