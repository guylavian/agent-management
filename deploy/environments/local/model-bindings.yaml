apiVersion: sre.ai/v1alpha1
kind: ModelBindings
environment: local
# LOCAL runs against whatever this cluster can actually reach, which is the
# developer's Ollama (SRE_LLM_TIER_*_URL in the integrations Secret) — there is
# no credential here for a hosted provider. These profiles named a hosted
# gpt-oss-20b while the endpoint served Ollama, so every routing call returned
# MODEL_UNAVAILABLE: the ids and the endpoint described different providers.
#
# qwen3:8b served that endpoint first and could not hold strict json_schema:
# routing returned ROUTE_INVALID from a model that was reachable and answering.
# The endpoint now fronts the Claude CLI, which does hold the schema. The id is
# recorded so this file names what actually answers; poc and production keep
# gpt-oss-20b.
#
# Only logical model ids are recorded here. The endpoint and its credential come
# from the environment, so this file stays credential-free.
profiles:
  manager-router:
    provider: openai-compatible
    model: claude-haiku
  tool-caller:
    provider: openai-compatible
    model: claude-haiku
  tier-l-synthesis:
    provider: openai-compatible
    model: claude-haiku
  # PLATFORM profile, not an Agent's. It backs console assistance such as
  # drafting a system prompt, and is bound here like any other profile so an
  # air-gapped deployment resolves it to the same internal endpoint as the rest.
  prompt-assist:
    provider: openai-compatible
    model: claude-haiku
