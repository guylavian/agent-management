apiVersion: sre.ai/v1alpha1
kind: AgentDeployment
# Deployment overlay ONLY. Routing, capabilities, prompt, tool access and
# ownership are properties of the Agent and live in config/agents/openshift.yaml;
# the schema rejects them here.
agentId: openshift
enabled: true
replicas: 2
resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
# escape hatch: this environment cannot follow the Service naming convention
endpoint: http://sre-agent-openshift:3000
