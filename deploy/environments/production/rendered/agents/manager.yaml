    environment.yaml: |-
      apiVersion: sre.ai/v1alpha1
      kind: DeploymentEnvironment
      environment: production
      # Cluster deployment. Endpoints follow the Service naming convention owned by
      # deploy/runtime/helm, so no agent needs an explicit endpoint override.
      namespace: sre-assistant
      endpointTemplate: http://sre-agent-{agentId}.{namespace}.svc.cluster.local
    manager.yaml: |-
      apiVersion: sre.ai/v1alpha1
      kind: AgentDeployment
      # The Manager is deployed from the same runtime image and chart as every
      # specialist; only ROLE and configuration differ.
      agentId: manager
      enabled: true
      replicas: 2
      resources:
        requests: { cpu: 500m, memory: 512Mi }
        limits: { cpu: "1", memory: 1Gi }
    model-bindings.yaml: |-
      apiVersion: sre.ai/v1alpha1
      kind: ModelBindings
      environment: production
      # Resolves the logical profiles in config/model-profiles/profiles.yaml to the
      # models actually served in this environment. No endpoint or credential is
      # rendered here: those arrive from the integrations Secret referenced by the
      # runtime chart, so nothing in Git needs to hold one.
      profiles:
        manager-router:
          provider: vllm
          model: qwen3-8b
        tool-caller:
          provider: vllm
          model: qwen3-8b
        tier-l-synthesis:
          provider: vllm
          model: qwen3-32b
        # PLATFORM profile, not an Agent's. It backs console assistance such as
        # drafting a system prompt, and is bound here like any other profile so an
        # air-gapped deployment resolves it to the same internal endpoint as the rest.
        prompt-assist:
          provider: vllm
          model: qwen3-8b
