  environmentFiles:
    environment.yaml: |-
      apiVersion: sre.ai/v1alpha1
      kind: DeploymentEnvironment
      environment: poc
      # Real local PoC (engineering/tools/start-real-poc.sh): loopback processes against real
      # Keycloak, Prometheus and ToolHive. Only the agents with a real MCP backend are
      # enabled here, which is what bounds the Manager's effective catalog. openshift
      # joined them when the Kubernetes MCP was approved: it reads the local cluster
      # through kubeconfig. Its openshift and splunk MCPs have no local backend, and
      # discovery is allSettled, so those contribute no tools rather than failing.
      namespace: sre-assistant
      endpointTemplate: http://sre-agent-{agentId}.{namespace}.svc.cluster.local
    manager.yaml: |-
      apiVersion: sre.ai/v1alpha1
      kind: AgentDeployment
      # The Manager is deployed from the same runtime image and chart as every
      # specialist; only ROLE and configuration differ.
      agentId: manager
      enabled: true
      replicas: 2
      resources:
        requests: { cpu: 500m, memory: 512Mi }
        limits: { cpu: "1", memory: 1Gi }
    model-bindings.yaml: |-
      apiVersion: sre.ai/v1alpha1
      kind: ModelBindings
      environment: poc
      # The real PoC points at a hosted OpenAI-compatible endpoint. SRE_LLM_BASE_URL
      # and SRE_LLM_API_KEY come from .env.real-poc (gitignored); only the logical
      # model ids are recorded here.
      profiles:
        manager-router:
          provider: groq
          model: openai/gpt-oss-20b
        tool-caller:
          provider: groq
          model: openai/gpt-oss-20b
        tier-l-synthesis:
          provider: groq
          model: openai/gpt-oss-20b
        # PLATFORM profile, not an Agent's. It backs console assistance such as
        # drafting a system prompt, and is bound here like any other profile so an
        # air-gapped deployment resolves it to the same internal endpoint as the rest.
        prompt-assist:
          provider: groq
          model: openai/gpt-oss-20b
