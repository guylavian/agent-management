apiVersion: sre.ai/v1alpha1
kind: AgentDeployment
# Deployment overlay ONLY. Routing, capabilities, prompt, tool access and
# ownership are properties of the Agent and live in config/agents/openshift.yaml;
# the schema rejects them here.
agentId: openshift
enabled: true
replicas: 2
resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
# loopback: the PoC runs each agent as a process, not a Service, so the cluster
# endpointTemplate does not resolve here
endpoint: http://127.0.0.1:3103
