# Local DISTRIBUTED deployment of the SRE agent platform.
# Manager + specialists each run as their own container from ONE runtime image.
# Wiki is a shared MCP tool: each specialist reaches the REAL wikikb MCP (direct),
# and falls back to the mock gateway for its domain backends (no local AD/OCP/net
# MCP or ToolHive). The model endpoint comes from the environment. Identity is
# mock-but-shared (local dev).
#
#   docker compose -f deploy/local/compose.agents.yaml up -d
#   TOKEN=$(curl -s -X POST http://localhost:3000/dev/token/alice | sed -E 's/.*"token":"([^"]+)".*/\1/')
#   curl -s -X POST http://localhost:3000/v1/query -H "authorization: Bearer $TOKEN" -H "content-type: application/json" -d '{"question":"According to our documentation, how should Keycloak login failures be investigated?","environment":"prod"}'
x-agent-base: &agent-base
  image: sre-agent-runtime:local
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"   # reach Ollama + wikikb on the Mac host
  volumes:
    - ../../platform/config:/app/platform/config:ro
    - ../environments:/app/deploy/environments:ro
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 15s

x-specialist-env: &specialist-env
  SRE_ENV: local
  SRE_CLIENT_OIDC: mock
  SRE_CLIENT_LLM: real
  # supplied by the environment, never hardcoded to one provider — this pointed
  # at a local Ollama, which tied the compose stack to a model that needed a
  # "/no_think" suffix to survive strict json_schema
  SRE_LLM_BASE_URL: ${SRE_LLM_BASE_URL:?set SRE_LLM_BASE_URL}
  SRE_LLM_API_KEY: ${SRE_LLM_API_KEY:-}
  SRE_LLM_MODEL: ${SRE_LLM_MODEL:-openai/gpt-oss-20b}
  SRE_REQUEST_DEADLINE_MS: "300000"
  SRE_CLIENT_DELEGATION: mock
  SRE_DELEGATION_MOCK_SECRET: local-shared-delegation-secret-change-me-0001
  SRE_CLIENT_POSTGRES: mock
  SRE_CLIENT_AGENT: mock                                  # accepts the manager's fixed local workload token
  # wiki via the REAL wikikb MCP; unconfigured domain servers fall back to the mock gateway
  SRE_CLIENT_TOOLHIVE: direct
  SRE_MCP_ENDPOINT_WIKI: http://host.docker.internal:8642/mcp

services:
  sre-agent-manager:
    <<: *agent-base
    container_name: sre-agent-manager
    environment:
      <<: *specialist-env
      AGENT_CONFIG: config/agents/manager.yaml
      SRE_DEPLOYMENT_ENVIRONMENT_DIR: ../deploy/environments/local
      SRE_CLIENT_AGENT: http-local                        # HTTP fan-out to specialist services
      SRE_CLIENT_TOOLHIVE: mock                            # manager has no data-plane MCP access
    ports:
      - "${MANAGER_PORT:-3000}:3000"
    depends_on:
      sre-agent-active-directory: { condition: service_healthy }
      sre-agent-openshift: { condition: service_healthy }
      sre-agent-network-observability: { condition: service_healthy }

  sre-agent-active-directory:
    <<: *agent-base
    container_name: sre-agent-active-directory
    environment:
      <<: *specialist-env
      AGENT_CONFIG: config/agents/active-directory.yaml

  sre-agent-openshift:
    <<: *agent-base
    container_name: sre-agent-openshift
    environment:
      <<: *specialist-env
      AGENT_CONFIG: config/agents/openshift.yaml

  sre-agent-network-observability:
    <<: *agent-base
    container_name: sre-agent-network-observability
    environment:
      <<: *specialist-env
      AGENT_CONFIG: config/agents/network-observability.yaml
