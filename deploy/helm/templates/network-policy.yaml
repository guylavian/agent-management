apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector: { matchLabels: { app: {{ .Release.Name }} } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { sre.ai/api-client: "true" } }
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { sre.ai/platform-service: "true" } }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 4318 }
        - { protocol: TCP, port: 5432 }
