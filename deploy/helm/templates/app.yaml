apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: SRE_ENV, value: production }
            - { name: SRE_CLIENT_OIDC, value: real }
            - { name: SRE_CLIENT_LLM, value: real }
            - { name: SRE_CLIENT_TOOLHIVE, value: real }
            - { name: SRE_CLIENT_RAG, value: real }
            - { name: SRE_CLIENT_POSTGRES, value: real }
            - { name: SRE_OTEL_EXPORTER, value: otlp }
          envFrom:
            - secretRef: { name: sre-agent-integrations }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: { app: {{ .Release.Name }} }
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
