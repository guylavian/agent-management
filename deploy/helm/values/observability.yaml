# helm install sre-agent-observability deploy/helm -f deploy/helm/values/observability.yaml
agent:
  name: observability
  mode: specialist
  configFile: agents/observability.yaml
replicaCount: 2
resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
hpa:
  enabled: true
