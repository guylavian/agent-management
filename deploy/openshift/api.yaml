apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent-api
  namespace: sre-assistant
spec:
  replicas: 2
  selector:
    matchLabels: { app: sre-agent-api }
  template:
    metadata:
      labels: { app: sre-agent-api }
    spec:
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/sre-assistant/sre-agent-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: SRE_ENV, value: production }
            - { name: SRE_CLIENT_OIDC, value: real }
            - { name: SRE_CLIENT_LLM, value: real }
            - { name: SRE_CLIENT_TOOLHIVE, value: real }
            - { name: SRE_CLIENT_RAG, value: real }
            - { name: SRE_CLIENT_POSTGRES, value: real }
            - { name: SRE_OTEL_EXPORTER, value: otlp }
          envFrom:
            - secretRef: { name: sre-agent-integrations }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
      securityContext: { runAsNonRoot: true }
---
apiVersion: v1
kind: Service
metadata:
  name: sre-agent-api
  namespace: sre-assistant
spec:
  selector: { app: sre-agent-api }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-agent-api-default-deny
  namespace: sre-assistant
spec:
  podSelector: { matchLabels: { app: sre-agent-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { sre.ai/api-client: "true" } }
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { sre.ai/platform-service: "true" } }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 4318 }
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
