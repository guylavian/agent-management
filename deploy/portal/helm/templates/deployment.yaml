apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent-portal
  labels:
    app.kubernetes.io/name: sre-agent-portal
    app.kubernetes.io/component: management-plane
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-agent-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-agent-portal
        app.kubernetes.io/component: management-plane
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- if eq .Values.gitops.provider "bitbucketServer" }}
          # the image's CMD loads app-config.yaml + app-config.production.yaml;
          # the Bitbucket SCM integration is a separate layer, joined only when
          # this deployment actually targets Bitbucket, because an integrations
          # entry with unset env vars would fail config validation everywhere else
          args: ["packages/backend", "--config", "app-config.yaml", "--config", "app-config.production.yaml", "--config", "app-config.bitbucket.yaml"]
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # the execution plane's read-only API; the portal has no other path to runtime state
            - name: SRE_MANAGEMENT_API_URL
              value: {{ .Values.runtime.managementApiUrl | quote }}
            - name: SRE_PORTAL_OIDC_METADATA_URL
              value: {{ .Values.oidc.metadataUrl | quote }}
            - name: SRE_PORTAL_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            # every credential arrives by secret reference — never from values or Git
            - name: SRE_PORTAL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretRef }}
                  key: client-secret
            - name: SRE_GITOPS_PROVIDER
              value: {{ .Values.gitops.provider | quote }}
            {{- if ne .Values.gitops.provider "none" }}
            - name: SRE_GITOPS_OWNER
              value: {{ .Values.gitops.owner | quote }}
            - name: SRE_GITOPS_REPO
              value: {{ .Values.gitops.repo | quote }}
            - name: SRE_GITOPS_BASE_BRANCH
              value: {{ .Values.gitops.baseBranch | quote }}
            {{- end }}
            {{- if eq .Values.gitops.provider "github" }}
            # the name Backstage's SCM integration reads (integrations.github.token)
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitops.tokenSecretRef }}
                  key: token
            {{- end }}
            {{- if eq .Values.gitops.provider "bitbucketServer" }}
            - name: SRE_GITOPS_HOST
              value: {{ required "gitops.host is required for bitbucketServer" .Values.gitops.host | quote }}
            - name: SRE_GITOPS_API_BASE_URL
              value: {{ printf "https://%s/rest/api/1.0" .Values.gitops.host | quote }}
            # the name app-config.bitbucket.yaml reads (integrations.bitbucketServer.token)
            - name: BITBUCKET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitops.tokenSecretRef }}
                  key: token
            {{- end }}
            - name: POSTGRES_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.connectionSecretRef }}
                  key: connection-string
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
