apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent-portal
  labels:
    app.kubernetes.io/name: sre-agent-portal
    app.kubernetes.io/component: management-plane
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-agent-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-agent-portal
        app.kubernetes.io/component: management-plane
      annotations:
        # roll the pods when the cluster config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ default "sre-agent-portal" .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # the image's CMD loads app-config.yaml + app-config.production.yaml;
          # the cluster layer (base URL, backend key, admin groups) is a ConfigMap
          # rendered by this chart, and the Bitbucket SCM integration is joined
          # only when this deployment actually targets Bitbucket, because an
          # integrations entry with unset env vars would fail config validation
          args:
            - packages/backend
            - --config
            - app-config.yaml
            - --config
            - app-config.production.yaml
            {{- if eq .Values.gitops.provider "bitbucketServer" }}
            - --config
            - app-config.bitbucket.yaml
            {{- end }}
            - --config
            - /config/app-config.cluster.yaml
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # the execution plane's read-only API; the portal has no other path to runtime state
            - name: SRE_MANAGEMENT_API_URL
              value: {{ .Values.runtime.managementApiUrl | quote }}
            {{- if .Values.runtime.oidc.tokenUrl }}
            - name: SRE_MANAGEMENT_OIDC_TOKEN_URL
              value: {{ .Values.runtime.oidc.tokenUrl | quote }}
            - name: SRE_MANAGEMENT_OIDC_CLIENT_ID
              value: {{ .Values.runtime.oidc.clientId | quote }}
            - name: SRE_MANAGEMENT_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.runtime.oidc.secretRef }}, key: client-secret } }
            - name: SRE_MANAGEMENT_OIDC_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.runtime.oidc.secretRef }}, key: username } }
            - name: SRE_MANAGEMENT_OIDC_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.runtime.oidc.secretRef }}, key: password } }
            {{- end }}
            - name: SRE_PORTAL_OIDC_METADATA_URL
              value: {{ required "oidc.metadataUrl is required" .Values.oidc.metadataUrl | quote }}
            - name: SRE_PORTAL_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            # every credential arrives by secret reference — never from values or Git
            - name: SRE_PORTAL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretRef }}
                  key: client-secret
            - name: BACKEND_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backendSecretRef }}
                  key: secret
            - name: SRE_GITOPS_PROVIDER
              value: {{ .Values.gitops.provider | quote }}
            {{- if ne .Values.gitops.provider "none" }}
            - name: SRE_GITOPS_OWNER
              value: {{ .Values.gitops.owner | quote }}
            - name: SRE_GITOPS_REPO
              value: {{ .Values.gitops.repo | quote }}
            - name: SRE_GITOPS_BASE_BRANCH
              value: {{ .Values.gitops.baseBranch | quote }}
            {{- end }}
            {{- if eq .Values.gitops.provider "github" }}
            # the name Backstage's SCM integration reads (integrations.github.token)
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitops.tokenSecretRef }}
                  key: token
            {{- end }}
            {{- if eq .Values.gitops.provider "bitbucketServer" }}
            - name: SRE_GITOPS_HOST
              value: {{ required "gitops.host is required for bitbucketServer" .Values.gitops.host | quote }}
            - name: SRE_GITOPS_API_BASE_URL
              value: {{ printf "https://%s/rest/api/1.0" .Values.gitops.host | quote }}
            # the name app-config.bitbucket.yaml reads (integrations.bitbucketServer.token)
            - name: BITBUCKET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitops.tokenSecretRef }}
                  key: token
            {{- end }}
            # the names app-config.production.yaml reads (backend.database.connection)
            {{- range $key := list "host" "port" "user" "password" }}
            - name: POSTGRES_{{ upper $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.connectionSecretRef }}
                  key: {{ $key }}
            {{- end }}
            {{- if .Values.caBundle.enabled }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/%s" .Values.caBundle.mountPath .Values.caBundle.key | quote }}
            {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cluster-config
              mountPath: /config
              readOnly: true
            {{- if .Values.caBundle.enabled }}
            - name: trusted-ca
              mountPath: {{ .Values.caBundle.mountPath | quote }}
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cluster-config
          configMap:
            name: sre-agent-portal-config
        {{- if .Values.caBundle.enabled }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.caBundle.configMap | quote }}
            items: [{ key: {{ .Values.caBundle.key | quote }}, path: {{ .Values.caBundle.key | quote }} }]
        {{- end }}
