# Kubernetes objects the platform team creates OUT OF BAND (oc apply from a
# vault-backed pipeline, External Secrets, Sealed Secrets, ...). NEVER commit a
# filled-in copy: every <...> is a placeholder and the repository guard
# (platform/tools/check-tracked-files.ts) rejects key material.
#
# Names must match the *Ref values in runtime-values / portal-values.
---
# Non-secret endpoints shared by every agent (extraEnvFrom in runtime-values).
# The chart validates nothing here; the runtime fails closed at startup if a
# value a `real` client needs is missing (platform/shared/config-loader).
apiVersion: v1
kind: ConfigMap
metadata: { name: sre-agent-endpoints, namespace: sre-assistant }
data:
  # --- user identity (tokens callers present to the Manager) ---
  SRE_OIDC_ISSUER: https://rhbk.example.internal/realms/sre-users
  SRE_OIDC_AUDIENCE: sre-agent-manager
  SRE_OIDC_JWKS_URI: https://rhbk.example.internal/realms/sre-users/protocol/openid-connect/certs
  # --- agent workload identity (Manager -> Specialist) ---
  SRE_INTERNAL_OIDC_ISSUER: https://rhbk.example.internal/realms/sre-agents
  SRE_INTERNAL_OIDC_AUDIENCE: sre-agent-runtime
  SRE_INTERNAL_OIDC_JWKS_URI: https://rhbk.example.internal/realms/sre-agents/protocol/openid-connect/certs
  # the Manager's service account, as it appears in the `sub` of its projected
  # token. Every pod mounts a token for the SAME audience, so this is the claim
  # a specialist uses to tell the Manager from another specialist.
  SRE_INTERNAL_EXPECTED_SUBJECT: system:serviceaccount:sre-assistant:sre-agent-manager
  # --- delegation tokens (Manager signs with the Secret key below; Specialists
  #     verify with the public key mounted from the ConfigMap below) ---
  SRE_DELEGATION_ISSUER: https://sre-agent-manager.sre-assistant.svc.cluster.local
  SRE_DELEGATION_PUBLIC_KEY_FILE: /etc/sre/delegation/public.pem
  # --- models: OpenAI-compatible internal endpoints (vLLM); no external provider ---
  SRE_LLM_TIER_S_URL: http://vllm-tier-s.ml.svc.cluster.local:8000/v1
  SRE_LLM_TIER_L_URL: http://vllm-tier-l.ml.svc.cluster.local:8000/v1
  # --- ToolHive: gateway URL and/or per-MCP-server proxy URLs (server id -> URL) ---
  SRE_TOOLHIVE_URL: https://toolhive.toolhive.svc.cluster.local
  SRE_TOOLHIVE_ENDPOINTS_JSON: '{"openshift":"https://mcp-openshift-proxy.toolhive.svc.cluster.local:8080/mcp","prometheus":"https://mcp-prometheus-proxy.toolhive.svc.cluster.local:8080/mcp"}'
  # --- ToolHive credential (RFC 8693 token exchange at the agents realm) ---
  SRE_TOOL_CREDENTIAL_STRATEGY: token-exchange
  SRE_TOOL_CREDENTIAL_TOKEN_ENDPOINT: https://rhbk.example.internal/realms/sre-agents/protocol/openid-connect/token
  SRE_TOOL_CREDENTIAL_ISSUER: https://rhbk.example.internal/realms/sre-agents
  SRE_TOOL_CREDENTIAL_AUDIENCE_PREFIX: "sre-toolhive:"
  SRE_TOOL_CREDENTIAL_JWKS_URI: https://rhbk.example.internal/realms/sre-agents/protocol/openid-connect/certs
  # --- optional: Argo CD read access so the Manager can report sync state ---
  SRE_ARGOCD_BASE_URL: https://openshift-gitops-server.openshift-gitops.svc.cluster.local
---
# SPKI PEM public half of SRE_DELEGATION_PRIVATE_KEY_PKCS8 (mounted by
# extraVolumes in runtime-values). Public, so a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata: { name: sre-agent-delegation-public-key, namespace: sre-assistant }
data:
  public.pem: |
    -----BEGIN PUBLIC KEY-----
    <manager delegation public key>
    -----END PUBLIC KEY-----
---
# Manager-only credentials: database and Argo CD access. envFrom mounts every key as an env var.
apiVersion: v1
kind: Secret
metadata: { name: sre-agent-manager-secrets, namespace: sre-assistant }
type: Opaque
stringData:
  SRE_POSTGRES_URL: postgresql://<user>:<password>@<host>:5432/<db>?sslmode=verify-full
  # optional: Argo CD read-only token paired with SRE_ARGOCD_BASE_URL
  SRE_ARGOCD_TOKEN: <argocd read-only api token>
---
# Reconciler-only credentials: four distinct PostgreSQL roles for the operational plane.
# Row-level security in sre_agent_operational_state confines each role to its own task,
# so one stolen credential cannot both activate an Agent and attest to its readiness.
# envFrom mounts every key as an env var.
apiVersion: v1
kind: Secret
metadata: { name: sre-agent-reconciler-secrets, namespace: sre-assistant }
type: Opaque
stringData:
  # Activation writer: reconciler creates/deletes sre_agent_operational_state rows
  # from Git desired state. Four roles enforce separation; a stolen sre_activation
  # credential cannot write attestations.
  SRE_ACTIVATION_POSTGRES_URL: postgresql://sre_activation_user:<password>@<host>:5432/<db>?sslmode=verify-full
  # Attestation writers: each role may update only its own attestation kind (runtime|identity|tool_access).
  # Stolen credential for one kind cannot forge attestations for another.
  SRE_ATTEST_RUNTIME_POSTGRES_URL: postgresql://sre_attest_runtime_user:<password>@<host>:5432/<db>?sslmode=verify-full
  SRE_ATTEST_IDENTITY_POSTGRES_URL: postgresql://sre_attest_identity_user:<password>@<host>:5432/<db>?sslmode=verify-full
  SRE_ATTEST_TOOL_ACCESS_POSTGRES_URL: postgresql://sre_attest_tool_access_user:<password>@<host>:5432/<db>?sslmode=verify-full
  # Keycloak admin client for identity attestation: checks that Keycloak realm and clients
  # match the envelope before marking an identity attestation ready
  SRE_KEYCLOAK_ADMIN_URL: https://rhbk.example.internal
  SRE_KEYCLOAK_ADMIN_REALM: sre-agents
  SRE_KEYCLOAK_ADMIN_CLIENT_ID: <service account client id>
  SRE_KEYCLOAK_ADMIN_CLIENT_SECRET: <service account client secret>
---
# Specialist-only credentials: their own client authentication for RFC 8693 token exchange.
# envFrom mounts every key as an env var.
apiVersion: v1
kind: Secret
# one per specialist: sre-agent-<agent>-secrets, because each authenticates
# as its own Keycloak client
metadata: { name: sre-agent-keycloak-secrets, namespace: sre-assistant }
type: Opaque
stringData:
  # Specialist: client secret for token exchange with the agents realm
  SRE_TOOL_CREDENTIAL_CLIENT_SECRET: <specialist workload client secret>
---
# Manager: PKCS#8 PEM private key that signs delegation tokens.
# File-mounted for security: specialists never see it as an env var.
apiVersion: v1
kind: Secret
metadata: { name: sre-agent-delegation-private-key, namespace: sre-assistant }
type: Opaque
stringData:
  private.pem: |
    -----BEGIN PRIVATE KEY-----
    <manager delegation signing key>
    -----END PRIVATE KEY-----
---
apiVersion: v1
kind: Secret
metadata: { name: internal-registry, namespace: sre-assistant }
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64 docker config for registry.example.internal>
---
apiVersion: v1
kind: Secret
metadata: { name: sre-agent-portal-oidc, namespace: sre-assistant }
stringData: { client-secret: <keycloak client secret for sre-agent-portal> }
---
apiVersion: v1
kind: Secret
metadata: { name: sre-agent-portal-runtime-oidc, namespace: sre-assistant }
stringData:
  client-secret: <keycloak client secret for sre-agent-portal-runtime>
  username: <service user in the users realm>
  password: <its password>
---
apiVersion: v1
kind: Secret
metadata: { name: sre-agent-portal-backend, namespace: sre-assistant }
stringData: { secret: <random 32+ byte string, same for every replica> }
---
apiVersion: v1
kind: Secret
metadata: { name: sre-agent-portal-gitops, namespace: sre-assistant }
stringData: { token: <Bitbucket HTTP access token with repo write, PR create> }
---
apiVersion: v1
kind: Secret
metadata: { name: sre-agent-portal-postgres, namespace: sre-assistant }
stringData:
  host: <postgres host>
  port: "5432"
  user: <user>
  password: <password>
---
# Argo CD repository credential (Argo CD namespace, not sre-assistant)
apiVersion: v1
kind: Secret
metadata:
  name: sre-agent-platform-repo
  namespace: openshift-gitops
  labels: { argocd.argoproj.io/secret-type: repository }
stringData:
  type: git
  url: https://bitbucket.example.internal/scm/sre/sre-agent-platform.git
  username: <bitbucket user>
  password: <bitbucket HTTP access token, read>
