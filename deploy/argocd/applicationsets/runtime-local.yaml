apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sre-agent-runtime-local
  namespace: argocd
spec:
  # The local twin of runtime.yaml. SAME generator, SAME chart, SAME one-image
  # rule — it differs only in which environment's rendered agents it discovers
  # and in the client wiring a laptop cluster can actually satisfy.
  #
  # Onboarding an agent locally is still just a commit under
  # deploy/environments/local/rendered/agents/; nothing here changes. Removing or
  # disabling one deletes its Application (prune) and its Deployment with it.
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - git:
        repoURL: https://github.com/guylavian/agent-management.git
        revision: main
        files:
          - path: deploy/environments/local/rendered/agents/*.yaml
  template:
    metadata:
      name: sre-agent-{{ .agent.name }}
      labels:
        sre.ai/agent: "{{ .agent.name }}"
        sre.ai/mode: "{{ .agent.mode }}"
    spec:
      project: sre-agent-platform
      sources:
        # Two refs to the SAME repo: the chart, and the rendered values it is fed.
        # `$values` needs a ref-only source, which is why this is a multi-source
        # Application rather than a single `source:`.
        - repoURL: https://github.com/guylavian/agent-management.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/guylavian/agent-management.git
          targetRevision: main
          path: deploy/runtime/helm
          helm:
            valueFiles:
              - $values/deploy/environments/local/rendered/agents/{{ .agent.name }}.yaml
            # Local-cluster wiring. These are the SAME knobs production sets to
            # `real`; SRE_ENV=local is what permits mocks, and loadAppConfig still
            # rejects every one of them under production/real-poc.
            parameters:
              # image built by deploy/argocd/build-runtime-image.sh and loaded into
              # the node — never pulled, so the cluster needs no registry at all
              - { name: image.repository, value: sre-agent-runtime }
              - { name: image.tag, value: local }
              - { name: image.pullPolicy, value: Never }
              - { name: replicaCount, value: "1" }
              # no OTel collector on a laptop
              - { name: telemetry.exporter, value: console }
              # no IdP, no ToolHive, no PostgreSQL in this cluster
              - { name: clients.oidc, value: mock }
              - { name: clients.toolhive, value: mock }
              - { name: clients.delegation, value: mock }
              # The Manager fans out over HTTP to the specialist Services using
              # environment.yaml's endpointTemplate, which is already cluster DNS.
              # A specialist accepts that call but never dials another agent.
              - name: clients.agent
                value: '{{ if eq .agent.mode "manager" }}http-local{{ else }}mock{{ end }}'
              # The endpoint, its credential and the served model id come from
              # the runtime chart's integrations Secret, not from this manifest.
              #
              # They were hardcoded to an Ollama on the developer's Mac reached
              # through the Docker Desktop host gateway, which meant this
              # deployment only worked on a machine running one — and carried a
              # "/no_think" suffix to dodge a 500 that thinking-mode plus strict
              # json_schema triggered on that model. Neither belongs in Git.
              - { name: clients.llm, value: real }
              # The per-role Secret carries ONLY that role's credential, so the
              # shared non-credential endpoints (SRE_LLM_TIER_*_URL, the served
              # model id) arrive through extraEnvFrom — which is the split the
              # chart documents. Without this a specialist starts with
              # clients.llm=real and no endpoint, and loadAppConfig correctly
              # refuses to boot.
              - { name: "extraEnvFrom[0].secretRef.name", value: sre-agent-integrations }
              # the model runs on the developer's Mac, reached through the
              # Docker host gateway — an address no namespace selector can name.
              # LOCAL ONLY: production reaches vLLM in a platform-service
              # namespace, which the built-in selector already covers.
              - { name: "networkPolicy.extraEgress[0].ports[0].protocol", value: TCP }
              - { name: "networkPolicy.extraEgress[0].ports[0].port", value: "11434" }
              - { name: "networkPolicy.extraEgress[0].to[0].ipBlock.cidr", value: "0.0.0.0/0" }
              # PostgreSQL, also on the host rather than in the cluster. Only the
              # manager reaches it: it owns the session store and the run
              # history, and a specialist has no business holding a database
              # credential — so the rule is not rendered for specialists at all.
              - name: "networkPolicy.extraEgress[1].ports[0].port"
                value: '{{ if eq .agent.mode "manager" }}55433{{ else }}0{{ end }}'
              - name: "networkPolicy.extraEgress[1].ports[0].protocol"
                value: TCP
              - name: "networkPolicy.extraEgress[1].to[0].ipBlock.cidr"
                value: '{{ if eq .agent.mode "manager" }}0.0.0.0/0{{ else }}127.0.0.1/32{{ end }}'
              # Durable run history and sessions. Specialists stay on the mock:
              # they record nothing and must not hold the credential.
              - name: clients.postgres
                value: '{{ if eq .agent.mode "manager" }}real{{ else }}mock{{ end }}'
              - { name: extraEnv.SRE_REQUEST_DEADLINE_MS, value: "300000" }
              # Read configuration from a live checkout of main instead of the
              # image, so a merged pull request reaches this cluster the same
              # way it reaches Argo — no image rebuild. The image still
              # supplies the code; only desired state follows Git.
              # a laptop node cannot fit old+new pods side by side at the
              # production-sized requests during a rolling update
              - { name: resources.requests.cpu, value: 100m }
              - { name: resources.requests.memory, value: 128Mi }
              - { name: gitSync.enabled, value: "true" }
              - { name: gitSync.repoURL, value: https://github.com/guylavian/agent-management.git }
              - { name: gitSync.credentialsSecret, value: sre-git-sync }
              # the sidecar shares the pod's NetworkPolicy, which can only name
              # an external remote by CIDR. This local cluster syncs from a
              # PUBLIC host whose address set is not fixed, so the route is the
              # open one — acceptable here because the policy still confines it
              # to 443 and this environment holds no production data. A real
              # deployment names its git host's own range instead.
              # quoted: an unquoted [0] would open a flow sequence inside this
              # flow mapping, which is a YAML parse error rather than a helm one
              - { name: "gitSync.egressCIDRs[0]", value: "0.0.0.0/0" }
      destination:
        server: https://kubernetes.default.svc
        # must equal deploy/environments/local/environment.yaml `namespace` —
        # the Manager resolves specialist endpoints by that convention
        namespace: sre-assistant
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
