# THE GITOPS OBJECTS THEMSELVES, RECONCILED FROM GIT.
#
# The AppProject used to be applied once by bootstrap-local.sh and reconciled by
# nothing. It drifted: the live copy lost ConfigMap and Route from its
# namespaceResourceWhitelist, and every Application in the project then failed to
# sync with "resource :ConfigMap is not permitted in project
# sre-agent-platform" — a total GitOps outage produced by an object no one was
# watching, and invisible in the Applications' own health.
#
# The root Application (applications/gitops-local.yaml) syncs this directory, and
# this directory lists that root, so the root manages itself: editing any of
# these in Git reaches the cluster, and editing them in the cluster is reverted.
#
# LOCAL ONLY. It names applicationsets/runtime-local.yaml deliberately —
# ../kustomization.yaml names the production ApplicationSet, and syncing that
# here would point a laptop cluster at production desired state.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../projects/sre-agent-platform.yaml
  - ../applicationsets/runtime-local.yaml
  - ../applications/gitops-local.yaml
