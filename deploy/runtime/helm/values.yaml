# One release per logical agent. All resources are named sre-agent-<agent.name>,
# which is the Service naming convention the Manager resolves endpoints against
# (deploy/environments/<env>/environment.yaml endpointTemplate). This chart owns
# the convention; nothing discovers Services through the Kubernetes API.
agent:
  # logical agent id (manager | active-directory | openshift | network-observability | ...)
  name: manager
  # manager | specialist | reconciler — selects env wiring, workload identity and network policy shape
  mode: manager
  # agent YAML baked into the runtime image; AGENT_CONFIG points here
  configFile: config/agents/manager.yaml
  # optional inline agent YAML; when non-empty it is mounted as /config/agent.yaml
  # (GitOps override without an image rebuild) and AGENT_CONFIG points there instead
  configOverride: ""

image:
  # same image for every agent — independent deployment, not independent implementation
  repository: registry.internal/sre-agent-runtime
  tag: 0.2.0
  pullPolicy: IfNotPresent

# pull secrets for a private/internal registry, e.g. [{ name: internal-registry }]
imagePullSecrets: []

# Enterprise CA bundle. The runtime verifies TLS against it (NODE_EXTRA_CA_CERTS);
# TLS verification is never disabled. On OpenShift the ConfigMap is filled by
# the cluster when it carries the label
#   config.openshift.io/inject-trusted-cabundle: "true"
# and `create: true` makes this release create that labelled (empty) ConfigMap.
caBundle:
  enabled: false
  configMap: sre-agent-trusted-ca
  key: ca-bundle.crt
  create: false
  mountPath: /etc/pki/ca-trust/extracted/pem

# Inline deploy/environments/<deploymentEnvironment>/environment.yaml. The file
# is baked into the image; setting this mounts a ConfigMap over it so the
# namespace / endpointTemplate can follow the cluster without an image rebuild.
# Must be the full document (apiVersion, kind, environment, namespace, endpointTemplate).
environmentOverride: ""

# AGENT DESIRED STATE, mounted from Git rather than baked into the image.
#
# Populated by `npm run render:deploy` — never by hand. Each map is
# `<file name>: <contents>` and becomes one ConfigMap mounted as a whole
# DIRECTORY over the image's copy, so a merged Agent reaches a running pod
# without an image rebuild and without a restart.
#
#   agents           manager only: every canonical Agent document
#   prompts          the prompt bodies this workload resolves
#   overlays         manager only: this environment's deployment overlays
#   environmentFiles manager only: environment.yaml, manager.yaml, model-bindings.yaml
#
# A specialist gets only its own prompt: it loads one Agent document, and
# shipping it the whole estate would hand every pod a list of every other Agent.
desiredState:
  agents: {}
  prompts: {}
  overlays: {}
  environmentFiles: {}

# LOCAL CLUSTERS ONLY: sync the repository into the pod and read configuration
# from a live checkout of the branch, so a merged pull request reaches the
# runtime without an image rebuild — the same way it reaches Argo. Production
# leaves this off: there the image IS the reviewed artifact. When enabled the
# runtime container's working directory moves to <root>/current/platform; the
# code still runs from the image.
gitSync:
  enabled: false
  repoURL: ""
  branch: main
  image: registry.k8s.io/git-sync/git-sync:v4.4.0
  periodSeconds: 30
  # name of a Secret with `username` and `password` (a token) for a private
  # repository; empty for a public one
  credentialsSecret: ""
  # A NetworkPolicy cannot select an external host by name, so the route to the
  # git remote has to be named by CIDR. The sidecar shares the pod's policy: with
  # the policy on and this empty, git-sync can never reach its remote and the pod
  # crashloops with nothing but a connection timeout to explain it. The chart
  # therefore REFUSES to render that combination rather than shipping it.
  # An in-cluster git host is better expressed by labelling its namespace and
  # adding 443 to the platform ports; use this for a remote outside the cluster.
  egressCIDRs: []
  egressPort: 443

# default replicas for manager and specialist; reconciler should override to 1
# (concurrent rounds would draw competing generations of the same Agent from Git,
# defeating the monotonic ordering that makes attestations idempotent)
replicaCount: 2

service:
  port: 3000

# empty name = the release creates and uses sre-agent-<agent.name>
serviceAccount:
  name: ""

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }

# SRE_ENV inside the pod; production forbids every mock client (fail-closed)
environment: production
defaultEnvironment: prod

# selects deploy/environments/<name> inside the image: agent enablement,
# endpoint convention and model bindings for this cluster
deploymentEnvironment: production

# logical model profile -> served model id; populated by the renderer from
# deploy/environments/<env>/model-bindings.yaml. Never holds an endpoint or key.
modelEnv: {}

# Secrets by role (envFrom mounts all keys as env vars).
#
# manager gets:
#   - managerSecret: SRE_POSTGRES_URL (session store), SRE_ARGOCD_TOKEN (Argo status)
#   - delegationPrivateKeySecret with file mount: SRE_DELEGATION_PRIVATE_KEY_FILE=/etc/sre/delegation-key/private.pem
#     (a DISTINCT directory from the public key's /etc/sre/delegation: two volumes on one path is a rejected pod)
#
# specialist gets:
#   - specialistSecret: SRE_TOOL_CREDENTIAL_CLIENT_SECRET (RFC 8693 token exchange)
#
# Both receive ConfigMap sre-agent-endpoints via extraEnvFrom: SRE_OIDC_*, SRE_LLM_TIER_*,
# SRE_TOOLHIVE_*, etc. (all non-credential config).
managerSecret: sre-agent-manager-secrets
# empty means "sre-agent-<agent>-secrets": each specialist authenticates as its
# OWN Keycloak client, so one shared secret would either not work or make every
# specialist share a credential boundary
specialistSecret: ""
# reconciler: database and Keycloak admin credentials for operational plane writes.
# Four distinct PostgreSQL roles (sre_activation, sre_attest_*) enforce that one
# stolen credential cannot both activate an Agent and attest to it.
reconcilerSecret: sre-agent-reconciler-secrets
delegationPrivateKeySecret: sre-agent-delegation-private-key

# Client wiring. Production is fail-closed and these defaults ARE that posture;
# loadAppConfig independently rejects any mock when SRE_ENV is production/real-poc,
# so a non-production overlay (deploy/argocd/applicationsets/runtime-local.yaml)
# can point a local cluster at mocks without weakening the production contract.
clients:
  oidc: real
  llm: real
  toolhive: real
  postgres: real
  agent: real
  delegation: real

# Non-credential environment variables an overlay needs to add (endpoints, model
# ids). Anything credential-shaped belongs in the per-role Secrets above, never here.
extraEnv: {}

# Additional envFrom sources, e.g. a ConfigMap holding the non-secret endpoints
# (SRE_TOOLHIVE_ENDPOINTS_JSON, SRE_OIDC_ISSUER, ...) so the Secret carries only
# credentials: [{ configMapRef: { name: sre-agent-endpoints } }]
extraEnvFrom: []

# Extra volumes, e.g. the delegation PUBLIC key specialists verify against
# (SRE_DELEGATION_PUBLIC_KEY_FILE) or a signed-jwt ToolHive key file
extraVolumes: []
extraVolumeMounts: []

# The uid/gid the runtime image's `node` user resolves to. runAsNonRoot alone is
# not enough: the kubelet refuses a non-numeric USER, so this must match the
# image or every pod fails to start.
# On OpenShift leave BOTH null: the restricted SCC assigns a uid from the
# namespace range and rejects a pod that pins one outside it.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000

# manager only: an OpenShift Route in front of the manager Service. Ingress
# traffic then also arrives from the router namespace, which the NetworkPolicy
# admits via routerNamespaceLabels.
route:
  enabled: false
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  annotations: {}
  routerNamespaceLabels:
    network.openshift.io/policy-group: ingress

telemetry:
  # otlp | console — console keeps a cluster without a collector from exporting
  exporter: otlp
  otlpEndpoint: http://otel-collector.sre-observability.svc.cluster.local:4318

# projected ServiceAccount token: the manager presents it to specialist services;
# a specialist only needs it to pass the same fail-closed startup validation
workloadIdentity:
  audience: sre-agent-runtime
  expirationSeconds: 600
  mountPath: /var/run/secrets/sre-workload

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

pdb:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  # namespaces labelled <key>: "true" host shared platform services (vLLM,
  # ToolHive, OTel collector, IdP, PostgreSQL)
  platformNamespaceLabel: sre.ai/platform-service
  # the ToolHive namespace carries this label as well; the manager's egress
  # selector excludes it, because ToolHive shares port 443 with the IdP and a
  # port list cannot separate them
  toolhiveNamespaceLabel: sre.ai/toolhive
  # namespaces labelled <key>: "true" may call the manager (API gateway / route)
  apiClientNamespaceLabel: sre.ai/api-client
  # cluster DNS ports the egress rule admits. OpenShift's CoreDNS pods listen
  # on 5353 (the dns-default Service maps 53 -> 5353 and NetworkPolicy matches
  # the pod port), so add it there.
  dnsPorts: [53]
  # TCP ports the agent may reach in platform-service namespaces; set per
  # environment to the actual service ports.
  # manager: IdP/HTTPS 443, OTLP 4318, PostgreSQL 5432, vLLM 8000
  managerPlatformPorts: [443, 4318, 5432, 8000]
  # specialist: ToolHive/HTTPS 443, OTLP 4318, vLLM 8000
  specialistPlatformPorts: [443, 4318, 8000]
  # reconciler: IdP/HTTPS 443 (Keycloak admin), OTLP 4318, PostgreSQL 5432 (attestation store)
  reconcilerPlatformPorts: [443, 4318, 5432]
