# DEPRECATED by deploy/environments/<env>/rendered/agents/. Kept only until the
# renderer's output replaces it in the ApplicationSet.
# helm install sre-agent-openshift deploy/helm -f deploy/helm/values/openshift.yaml
agent:
  name: openshift
  mode: specialist
  configFile: config/agents/openshift.yaml
replicaCount: 2
resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
hpa:
  enabled: true
