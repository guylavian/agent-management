# DEPRECATED by deploy/environments/<env>/rendered/agents/. Kept only until the
# renderer's output replaces it in the ApplicationSet.
# helm install sre-agent-keycloak deploy/helm -f deploy/helm/values/keycloak.yaml
agent:
  name: keycloak
  mode: specialist
  configFile: config/agents/keycloak.yaml
replicaCount: 2
resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
hpa:
  enabled: true
