{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sre-agent.fullname" . }}
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "sre-agent.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if eq .Values.agent.mode "manager" }}
    # only the API gateway namespace(s) may reach the manager
    - from:
        - namespaceSelector:
            matchLabels: { {{ .Values.networkPolicy.apiClientNamespaceLabel }}: "true" }
        {{- if .Values.route.enabled }}
        # the OpenShift router terminates the Route and forwards from its namespace
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.route.routerNamespaceLabels | nindent 14 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 3000 }
    {{- else }}
    # only manager pods in this namespace may reach a specialist —
    # the internal Agent API is not exposed to anything else
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sre-agent-runtime
              sre.ai/mode: manager
      ports:
        - { protocol: TCP, port: 3000 }
    {{- end }}
  egress:
    # cluster DNS
    - ports:
        {{- range .Values.networkPolicy.dnsPorts }}
        - { protocol: UDP, port: {{ . }} }
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- if eq .Values.agent.mode "manager" }}
    # manager → specialist services in this namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sre-agent-runtime
              sre.ai/mode: specialist
      ports:
        - { protocol: TCP, port: 3000 }
    # manager → IdP / vLLM / OTel / PostgreSQL. NOT ToolHive: the manager never
    # accumulates the specialists' data-plane access. That exclusion is made by
    # the SELECTOR, because ToolHive answers on the same port as the IdP and a
    # port list therefore cannot express it.
    - to:
        - namespaceSelector:
            matchExpressions:
              - { key: {{ .Values.networkPolicy.platformNamespaceLabel }}, operator: In, values: ["true"] }
              - { key: {{ .Values.networkPolicy.toolhiveNamespaceLabel }}, operator: DoesNotExist }
      ports:
        {{- range .Values.networkPolicy.managerPlatformPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- else }}
    # specialist → ToolHive / vLLM / OTel; never to other agent pods
    - to:
        - namespaceSelector:
            matchLabels: { {{ .Values.networkPolicy.platformNamespaceLabel }}: "true" }
      ports:
        {{- range .Values.networkPolicy.specialistPlatformPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
{{- end }}
