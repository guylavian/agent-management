{{- if .Values.networkPolicy.enabled }}
{{- /*
  A gitSync sidecar shares this pod's NetworkPolicy. Rendering one with no route
  to its remote yields a pod that starts, passes its liveness probe on the
  runtime container, and never reads desired state — a failure that surfaces only
  as a connection timeout in a sidecar nobody is watching. Refuse it here.
*/}}
{{- if and .Values.gitSync.enabled (not .Values.gitSync.egressCIDRs) }}
{{- fail "gitSync is enabled behind an enabled networkPolicy, but gitSync.egressCIDRs is empty: the sidecar would have no route to its git remote. Name the remote's CIDR, or host it in a platform-service namespace and drop gitSync." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sre-agent.fullname" . }}
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "sre-agent.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if eq .Values.agent.mode "manager" }}
    # only the API gateway namespace(s) may reach the manager
    - from:
        - namespaceSelector:
            matchLabels: { {{ .Values.networkPolicy.apiClientNamespaceLabel }}: "true" }
        {{- if .Values.route.enabled }}
        # the OpenShift router terminates the Route and forwards from its namespace
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.route.routerNamespaceLabels | nindent 14 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 3000 }
    {{- else if eq .Values.agent.mode "reconciler" }}
    # reconciler serves only a health endpoint for probes; no external traffic
    {{- else }}
    # only manager pods in this namespace may reach a specialist —
    # the internal Agent API is not exposed to anything else
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sre-agent-runtime
              sre.ai/mode: manager
      ports:
        - { protocol: TCP, port: 3000 }
    {{- end }}
  egress:
    {{- if .Values.gitSync.enabled }}
    # the desired-state sidecar's git remote, named by CIDR because a
    # NetworkPolicy has no way to select an external host
    - to:
        {{- range .Values.gitSync.egressCIDRs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.gitSync.egressPort }} }
    {{- end }}
    # cluster DNS
    - ports:
        {{- range .Values.networkPolicy.dnsPorts }}
        - { protocol: UDP, port: {{ . }} }
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- if eq .Values.agent.mode "manager" }}
    # manager → specialist services in this namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sre-agent-runtime
              sre.ai/mode: specialist
      ports:
        - { protocol: TCP, port: 3000 }
    # manager → IdP / vLLM / OTel / PostgreSQL. NOT ToolHive: the manager never
    # accumulates the specialists' data-plane access. That exclusion is made by
    # the SELECTOR, because ToolHive answers on the same port as the IdP and a
    # port list therefore cannot express it.
    - to:
        - namespaceSelector:
            matchExpressions:
              - { key: {{ .Values.networkPolicy.platformNamespaceLabel }}, operator: In, values: ["true"] }
              - { key: {{ .Values.networkPolicy.toolhiveNamespaceLabel }}, operator: DoesNotExist }
      ports:
        {{- range .Values.networkPolicy.managerPlatformPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- else if eq .Values.agent.mode "reconciler" }}
    # reconciler → specialist services: runtime probing (readiness check)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sre-agent-runtime
              sre.ai/mode: specialist
      ports:
        - { protocol: TCP, port: 3000 }
    # reconciler → IdP (Keycloak admin) / OTel / PostgreSQL (attestation store)
    - to:
        - namespaceSelector:
            matchLabels: { {{ .Values.networkPolicy.platformNamespaceLabel }}: "true" }
      ports:
        {{- range .Values.networkPolicy.reconcilerPlatformPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- else }}
    # specialist → ToolHive / vLLM / OTel; never to other agent pods
    - to:
        - namespaceSelector:
            matchLabels: { {{ .Values.networkPolicy.platformNamespaceLabel }}: "true" }
      ports:
        {{- range .Values.networkPolicy.specialistPlatformPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- /*
      The database, when it lives outside the cluster. Gated on the postgres
      CLIENT, not on the agent mode: the chart already knows whether this
      workload speaks to a database, and expressing it as a mode in the
      ApplicationSet produced `port: 0` for the modes that do not — which
      Kubernetes rejects, so no specialist could sync at all.
    */}}
    {{- if and (eq .Values.clients.postgres "real") .Values.networkPolicy.postgresEgressCIDRs }}
    - to:
        {{- range .Values.networkPolicy.postgresEgressCIDRs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.postgresEgressPort }} }
    {{- end }}
    {{- /*
      Egress the selectors above cannot express — a model endpoint outside the
      cluster, a collector reached by IP. Empty by default: the closed posture
      holds unless an operator writes a rule down.
    */}}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
