apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-agent.fullname" . }}
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "sre-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sre-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sre-agent.serviceAccountName" . }}
      terminationGracePeriodSeconds: 35
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.gitSync.enabled }}
      initContainers:
        # the first clone happens BEFORE the runtime starts: startup fails
        # closed on configuration, so the checkout must exist when it loads
        - name: git-sync-init
          image: {{ .Values.gitSync.image | quote }}
          args: ["--one-time", "--repo={{ .Values.gitSync.repoURL }}", "--ref={{ .Values.gitSync.branch }}", "--root=/repo", "--link=current", "--depth=1"]
          {{- if .Values.gitSync.credentialsSecret }}
          env:
            - { name: GITSYNC_USERNAME, valueFrom: { secretKeyRef: { name: {{ .Values.gitSync.credentialsSecret | quote }}, key: username } } }
            - { name: GITSYNC_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.gitSync.credentialsSecret | quote }}, key: password } } }
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65533
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: git-repo, mountPath: /repo }
            # git-sync writes its gitconfig under /tmp; the root filesystem is
            # read-only, so give it a scratch dir rather than widening the root
            - { name: git-tmp, mountPath: /tmp }
      {{- end }}
      containers:
        - name: runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.gitSync.enabled }}
          # code runs from the image; every relative configuration read
          # (agents, prompts, deploy/environments, change previews) resolves
          # into the synced checkout instead of the image's baked copy
          workingDir: /repo/current/platform
          command: ["node", "/app/platform/runtime-host/src/main.ts"]
          {{- else if eq .Values.agent.mode "reconciler" }}
          # reconciler always sets its own entrypoint
          command: ["node", "/app/platform/runtime-host/src/reconciler-main.ts"]
          {{- end }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            {{- /*
              With a git-sync checkout these paths are ABSOLUTE, through the
              `current` symlink. workingDir cannot carry them: the kernel pins a
              process's CWD to the inode it resolved at exec, so when git-sync
              repoints `current` and deletes the worktree it replaced, every
              relative path resolves inside a directory that no longer exists.
              Addressing through the link re-resolves it on each read.
            */}}
            - name: AGENT_CONFIG
              value: {{ if .Values.agent.configOverride }}/config/agent.yaml{{ else }}{{ .Values.agent.configFile }}{{ end }}
            {{- if .Values.gitSync.enabled }}
            # Relative config paths resolve from HERE, not from the working
            # directory. git-sync repoints `current` and deletes the worktree it
            # replaced, while the kernel pins a process's CWD to the inode it
            # resolved at exec — so every relative read would land in a deleted
            # directory on the first sync after startup. Addressing through the
            # symlink re-resolves it on each read.
            - { name: SRE_CONFIG_BASE_DIR, value: /repo/current/platform }
            {{- end }}
            # ROLE and AGENT_ID state the deployment's intent. The Agent document
            # remains authoritative; startup fails if the two disagree, so a
            # manifest cannot quietly mount the wrong configuration.
            - { name: ROLE, value: {{ .Values.agent.mode | quote }} }
            - { name: AGENT_ID, value: {{ .Values.agent.name | quote }} }
            - { name: SRE_ENV, value: {{ .Values.environment | quote }} }
            - { name: SRE_DEFAULT_ENVIRONMENT, value: {{ .Values.defaultEnvironment | quote }} }
            - { name: SRE_OTEL_EXPORTER, value: {{ .Values.telemetry.exporter | quote }} }
            - { name: SRE_OTEL_ENDPOINT, value: {{ .Values.telemetry.otlpEndpoint | quote }} }
            - { name: SRE_OTEL_SERVICE_NAME, value: {{ include "sre-agent.fullname" . | quote }} }
            # production is fail-closed: every client must be explicitly real, and
            # `clients` defaults to exactly that. A non-production overlay may
            # downgrade a client here, but loadAppConfig still rejects any mock in
            # SRE_ENV=production/real-poc, so the values file cannot widen what the
            # runtime accepts — it can only narrow what a local cluster wires up.
            # The manager process constructs only oidc/llm/agent/delegation/postgres;
            # its ToolHive path additionally stays blocked by NetworkPolicy. Reconciler
            # uses only postgres/oidc (Keycloak admin client, not token exchange).
            - { name: SRE_CLIENT_OIDC, value: {{ .Values.clients.oidc | quote }} }
            - { name: SRE_CLIENT_LLM, value: {{ .Values.clients.llm | quote }} }
            - { name: SRE_CLIENT_TOOLHIVE, value: {{ .Values.clients.toolhive | quote }} }
            - { name: SRE_CLIENT_POSTGRES, value: {{ .Values.clients.postgres | quote }} }
            - { name: SRE_CLIENT_AGENT, value: {{ .Values.clients.agent | quote }} }
            - { name: SRE_CLIENT_DELEGATION, value: {{ .Values.clients.delegation | quote }} }
            {{- range $name, $value := .Values.extraEnv }}
            - { name: {{ $name }}, value: {{ $value | quote }} }
            {{- end }}
            {{- if .Values.caBundle.enabled }}
            - { name: NODE_EXTRA_CA_CERTS, value: {{ printf "%s/%s" .Values.caBundle.mountPath .Values.caBundle.key | quote }} }
            {{- end }}
            {{- if or (eq .Values.agent.mode "manager") (eq .Values.agent.mode "reconciler") }}
            # the Manager derives its effective catalog from config/agents intersected
            # with this environment's deployment state; the Reconciler reads the same
            # desired state to project it into the operational plane
            - { name: SRE_DEPLOYMENT_ENVIRONMENT_DIR, value: {{ printf "../deploy/environments/%s" .Values.deploymentEnvironment | quote }} }
            {{- end }}
            # Both modes: loadAppConfig requires a workload credential whenever the
            # agent client is real, and a specialist runs the same validation. The
            # token is the pod's OWN identity; a specialist still never dials another agent.
            - { name: SRE_WORKLOAD_TOKEN_FILE, value: {{ printf "%s/token" .Values.workloadIdentity.mountPath | quote }} }
            # logical model profile -> served model id, rendered from
            # deploy/environments/<env>/model-bindings.yaml. Endpoints and API
            # keys stay in the Secret below; nothing credential-shaped is rendered.
            {{- range $name, $value := .Values.modelEnv }}
            - { name: {{ $name }}, value: {{ $value | quote }} }
            {{- end }}
            {{- if eq .Values.agent.mode "reconciler" }}
            # reconcile interval in milliseconds: how often the reconciler projects Git
            # desired state into sre_agent_operational_state rows
            - { name: SRE_RECONCILE_INTERVAL_MS, value: "15000" }
            {{- end }}
            {{- if and (eq .Values.agent.mode "manager") (ne .Values.clients.delegation "mock") }}
            # manager: file-mounted delegation key replaces inline env var (C2).
            # A mocked delegation client signs with a shared secret and reads no
            # key file, so demanding the mount there only blocks the pod.
            - { name: SRE_DELEGATION_PRIVATE_KEY_FILE, value: /etc/sre/delegation-key/private.pem }
            {{- end }}
          envFrom:
            {{- if eq .Values.agent.mode "manager" }}
            - secretRef: { name: {{ .Values.managerSecret | quote }} }
            {{- else if eq .Values.agent.mode "reconciler" }}
            - secretRef: { name: {{ .Values.reconcilerSecret | quote }} }
            {{- else }}
            - secretRef: { name: {{ .Values.specialistSecret | default (printf "sre-agent-%s-secrets" .Values.agent.name) | quote }} }
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # The image declares `USER node`, which the kubelet cannot verify
            # against runAsNonRoot because it is a name, not a uid — the pod
            # fails CreateContainerConfigError. State the numeric uid the image
            # actually resolves that name to (node:24-alpine -> 1000).
            # Both omitted (null) on OpenShift, where the SCC assigns the uid.
            {{- with .Values.securityContext.runAsUser }}
            runAsUser: {{ . }}
            {{- end }}
            {{- with .Values.securityContext.runAsGroup }}
            runAsGroup: {{ . }}
            {{- end }}
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: workload-identity, mountPath: {{ .Values.workloadIdentity.mountPath | quote }}, readOnly: true }
            {{- if and (eq .Values.agent.mode "manager") (ne .Values.clients.delegation "mock") }}
            # a DISTINCT directory: the public key is mounted at /etc/sre/delegation by
            # every release, and two volumes on one path is a rejected pod
            - { name: delegation-private-key, mountPath: /etc/sre/delegation-key, readOnly: true }
            {{- end }}
            {{- if .Values.agent.configOverride }}
            - { name: agent-config, mountPath: /config, readOnly: true }
            {{- end }}
            {{- if .Values.environmentOverride }}
            # WORKDIR is /app/platform; SRE_DEPLOYMENT_ENVIRONMENT_DIR is ../deploy/environments/<env>
            #
            # DEPRECATED in favour of desiredState.environmentFiles below. A
            # subPath mount is resolved once at container start and never sees a
            # ConfigMap update, so this can only ever deliver the value the pod
            # started with — fine for a fixed namespace, useless for anything
            # that has to follow Git.
            - { name: environment-config, mountPath: {{ printf "/app/deploy/environments/%s/environment.yaml" .Values.deploymentEnvironment | quote }}, subPath: environment.yaml, readOnly: true }
            {{- end }}
            {{- /*
              Whole-directory mounts, deliberately. They shadow the image's
              baked copies, which is what lets one generic image serve an Agent
              that did not exist when it was built. Ordering does not matter to
              the kubelet: it sorts mounts by path, so the nested `agents`
              mount lands inside the environment mount.
            */}}
            {{- if and .Values.desiredState.agents (or (eq .Values.agent.mode "manager") (eq .Values.agent.mode "reconciler")) }}
            - { name: desired-agents, mountPath: "/app/platform/config/agents", readOnly: true }
            {{- end }}
            {{- if .Values.desiredState.prompts }}
            - { name: desired-prompts, mountPath: "/app/platform/config/prompts", readOnly: true }
            {{- end }}
            {{- if and .Values.desiredState.environmentFiles (or (eq .Values.agent.mode "manager") (eq .Values.agent.mode "reconciler")) }}
            # NOTE: this shadows `rendered/` inside the environment directory.
            # The runtime reads it only to diff a change preview against disk,
            # and that path already treats an unreadable file as "not there",
            # so a preview renders as an addition rather than failing.
            - { name: desired-environment, mountPath: {{ printf "/app/deploy/environments/%s" .Values.deploymentEnvironment | quote }}, readOnly: true }
            {{- end }}
            {{- if and .Values.desiredState.overlays (or (eq .Values.agent.mode "manager") (eq .Values.agent.mode "reconciler")) }}
            - { name: desired-overlays, mountPath: {{ printf "/app/deploy/environments/%s/agents" .Values.deploymentEnvironment | quote }}, readOnly: true }
            {{- end }}
            {{- if .Values.caBundle.enabled }}
            - { name: trusted-ca, mountPath: {{ .Values.caBundle.mountPath | quote }}, readOnly: true }
            {{- end }}
            {{- if .Values.gitSync.enabled }}
            - { name: git-repo, mountPath: /repo, readOnly: true }
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.gitSync.enabled }}
        # keeps the checkout following the branch; the runtime revalidates its
        # desired state every few seconds and picks the new revision up itself
        - name: git-sync
          image: {{ .Values.gitSync.image | quote }}
          args: ["--repo={{ .Values.gitSync.repoURL }}", "--ref={{ .Values.gitSync.branch }}", "--root=/repo", "--link=current", "--depth=1", "--period={{ .Values.gitSync.periodSeconds }}s"]
          {{- if .Values.gitSync.credentialsSecret }}
          env:
            - { name: GITSYNC_USERNAME, valueFrom: { secretKeyRef: { name: {{ .Values.gitSync.credentialsSecret | quote }}, key: username } } }
            - { name: GITSYNC_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.gitSync.credentialsSecret | quote }}, key: password } } }
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65533
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: git-repo, mountPath: /repo }
            # git-sync writes its gitconfig under /tmp; the root filesystem is
            # read-only, so give it a scratch dir rather than widening the root
            - { name: git-tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
        {{- end }}
      volumes:
        {{- if .Values.gitSync.enabled }}
        - name: git-repo
          emptyDir: {}
        - name: git-tmp
          emptyDir: {}
        {{- end }}
        - name: workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.workloadIdentity.audience | quote }}
                  expirationSeconds: {{ .Values.workloadIdentity.expirationSeconds }}
        {{- if and (eq .Values.agent.mode "manager") (ne .Values.clients.delegation "mock") }}
        # manager: delegation private key (file-mounted for security, C2)
        - name: delegation-private-key
          secret:
            secretName: {{ .Values.delegationPrivateKeySecret | quote }}
            items:
              - key: private.pem
                path: private.pem
            defaultMode: 0400
        {{- end }}
        {{- if .Values.agent.configOverride }}
        - name: agent-config
          configMap: { name: {{ include "sre-agent.fullname" . }}-config }
        {{- end }}
        {{- if .Values.environmentOverride }}
        - name: environment-config
          configMap: { name: {{ include "sre-agent.fullname" . }}-environment }
        {{- end }}
        {{- if and .Values.desiredState.agents (or (eq .Values.agent.mode "manager") (eq .Values.agent.mode "reconciler")) }}
        - name: desired-agents
          configMap: { name: {{ include "sre-agent.fullname" . }}-agents }
        {{- end }}
        {{- if .Values.desiredState.prompts }}
        - name: desired-prompts
          configMap: { name: {{ include "sre-agent.fullname" . }}-prompts }
        {{- end }}
        {{- if and .Values.desiredState.environmentFiles (or (eq .Values.agent.mode "manager") (eq .Values.agent.mode "reconciler")) }}
        - name: desired-environment
          configMap: { name: {{ include "sre-agent.fullname" . }}-environment-files }
        {{- end }}
        {{- if and .Values.desiredState.overlays (or (eq .Values.agent.mode "manager") (eq .Values.agent.mode "reconciler")) }}
        - name: desired-overlays
          configMap: { name: {{ include "sre-agent.fullname" . }}-overlays }
        {{- end }}
        {{- if .Values.caBundle.enabled }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.caBundle.configMap | quote }}
            items: [{ key: {{ .Values.caBundle.key | quote }}, path: {{ .Values.caBundle.key | quote }} }]
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
