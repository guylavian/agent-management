apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-agent.fullname" . }}
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "sre-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sre-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sre-agent.serviceAccountName" . }}
      containers:
        - name: runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: AGENT_CONFIG
              value: {{ if .Values.agent.configOverride }}/config/agent.yaml{{ else }}{{ .Values.agent.configFile }}{{ end }}
            # ROLE and AGENT_ID state the deployment's intent. The Agent document
            # remains authoritative; startup fails if the two disagree, so a
            # manifest cannot quietly mount the wrong configuration.
            - { name: ROLE, value: {{ .Values.agent.mode | quote }} }
            - { name: AGENT_ID, value: {{ .Values.agent.name | quote }} }
            - { name: SRE_ENV, value: {{ .Values.environment | quote }} }
            - { name: SRE_DEFAULT_ENVIRONMENT, value: {{ .Values.defaultEnvironment | quote }} }
            - { name: SRE_OTEL_EXPORTER, value: {{ .Values.telemetry.exporter | quote }} }
            - { name: SRE_OTEL_ENDPOINT, value: {{ .Values.telemetry.otlpEndpoint | quote }} }
            - { name: SRE_OTEL_SERVICE_NAME, value: {{ include "sre-agent.fullname" . | quote }} }
            # production is fail-closed: every client must be explicitly real, and
            # `clients` defaults to exactly that. A non-production overlay may
            # downgrade a client here, but loadAppConfig still rejects any mock in
            # SRE_ENV=production/real-poc, so the values file cannot widen what the
            # runtime accepts — it can only narrow what a local cluster wires up.
            # The manager process constructs only oidc/llm/agent/delegation/postgres;
            # its ToolHive path additionally stays blocked by NetworkPolicy.
            - { name: SRE_CLIENT_OIDC, value: {{ .Values.clients.oidc | quote }} }
            - { name: SRE_CLIENT_LLM, value: {{ .Values.clients.llm | quote }} }
            - { name: SRE_CLIENT_TOOLHIVE, value: {{ .Values.clients.toolhive | quote }} }
            - { name: SRE_CLIENT_POSTGRES, value: {{ .Values.clients.postgres | quote }} }
            - { name: SRE_CLIENT_AGENT, value: {{ .Values.clients.agent | quote }} }
            - { name: SRE_CLIENT_DELEGATION, value: {{ .Values.clients.delegation | quote }} }
            {{- range $name, $value := .Values.extraEnv }}
            - { name: {{ $name }}, value: {{ $value | quote }} }
            {{- end }}
            {{- if eq .Values.agent.mode "manager" }}
            # the Manager derives its effective catalog from config/agents intersected
            # with this environment's deployment state; there is no registry file
            - { name: SRE_DEPLOYMENT_ENVIRONMENT_DIR, value: {{ printf "../deploy/environments/%s" .Values.deploymentEnvironment | quote }} }
            - { name: SRE_WORKLOAD_TOKEN_FILE, value: {{ printf "%s/token" .Values.workloadIdentity.mountPath | quote }} }
            {{- end }}
            # logical model profile -> served model id, rendered from
            # deploy/environments/<env>/model-bindings.yaml. Endpoints and API
            # keys stay in the Secret below; nothing credential-shaped is rendered.
            {{- range $name, $value := .Values.modelEnv }}
            - { name: {{ $name }}, value: {{ $value | quote }} }
            {{- end }}
          envFrom:
            - secretRef: { name: {{ .Values.integrationsSecret | quote }} }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL] }
          volumeMounts:
            {{- if eq .Values.agent.mode "manager" }}
            - { name: workload-identity, mountPath: {{ .Values.workloadIdentity.mountPath | quote }}, readOnly: true }
            {{- end }}
            {{- if .Values.agent.configOverride }}
            - { name: agent-config, mountPath: /config, readOnly: true }
            {{- end }}
      volumes:
        {{- if eq .Values.agent.mode "manager" }}
        - name: workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.workloadIdentity.audience | quote }}
                  expirationSeconds: {{ .Values.workloadIdentity.expirationSeconds }}
        {{- end }}
        {{- if .Values.agent.configOverride }}
        - name: agent-config
          configMap: { name: {{ include "sre-agent.fullname" . }}-config }
        {{- end }}
