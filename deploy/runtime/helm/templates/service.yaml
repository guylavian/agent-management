apiVersion: v1
kind: Service
metadata:
  # Service DNS IS the endpoint convention the Manager resolves against:
  # http://sre-agent-<name>.<namespace>.svc.cluster.local
  # (deploy/environments/<env>/environment.yaml endpointTemplate)
  name: {{ include "sre-agent.fullname" . }}
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  selector: {{- include "sre-agent.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
---
{{- if not .Values.serviceAccount.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sre-agent.fullname" . }}
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.agent.configOverride }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-agent.fullname" . }}-config
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
data:
  agent.yaml: |
{{ .Values.agent.configOverride | indent 4 }}
{{- end }}
{{- if .Values.environmentOverride }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-agent.fullname" . }}-environment
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
data:
  environment.yaml: |
{{ .Values.environmentOverride | indent 4 }}
{{- end }}
{{- if and .Values.caBundle.enabled .Values.caBundle.create }}
---
# Empty on purpose: OpenShift's network operator fills `ca-bundle.crt` with the
# cluster-wide trusted bundle because of the label. Off OpenShift, create the
# ConfigMap yourself and set caBundle.create=false.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.caBundle.configMap | quote }}
  labels:
    config.openshift.io/inject-trusted-cabundle: "true"
    {{- include "sre-agent.labels" . | nindent 4 }}
{{- end }}
