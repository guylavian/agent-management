# Local PoC infrastructure: Keycloak (dev) + Prometheus.
# Reproducible with:  docker compose up -d
# Ports are configurable via env (see infra/README.md); sensible defaults below.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: sre-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # local dev admin (test-prep only; the SRE agent never performs Keycloak writes)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HTTP_PORT:-8080}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # user login-event metrics (Keycloak 26 opt-in feature)
      KC_FEATURES: user-event-metrics
      KC_EVENT_METRICS_USER_ENABLED: "true"
      KC_EVENT_METRICS_USER_TAGS: realm,idp,clientId
    volumes:
      - ./infra/keycloak/realm-sre-test.json:/opt/keycloak/data/import/realm-sre-test.json:ro
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"      # application / OIDC
      - "${KEYCLOAK_MGMT_PORT:-9000}:9000"      # management: /health, /metrics
    healthcheck:
      # image has bash but no curl/wget; probe the management port with /dev/tcp
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "UP" <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sre-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Host-backed TSDB: the Docker VM overlay is full on this local host, so
      # keep Prometheus data on the host disk instead of an anonymous volume.
      - ./.real-poc/prom-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
