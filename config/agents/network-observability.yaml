apiVersion: sre.ai/v1alpha1
kind: Agent
metadata:
  name: network-observability
  owner: network-observability
  description: "Network paths, interfaces, load balancers, Prometheus, Splunk, and observability"
  displayName: Network Observability Agent
spec:
  type: specialist
  lifecycle: active
  model: { tier: small, profile: tool-caller }
  prompt: { systemFile: config/prompts/network-observability.md }
  identity: { provider: keycloak, clientId: sre-agent-network-observability }
  environments: ["prod", "dr", "lab"]
  routing:
    exactTerms: ["packet loss", "bgp", "interface errors", "interface error", "splunk", "network latency"]
    entityPatterns: []
    ambiguousTerms: ["gateway", "policy", "latency"]
    capabilities: ["connectivity/latency/packet-loss", "Splunk network queries", "network-path evidence"]
    exclusions: ["identity/authentication", "OpenShift workload internals"]
  access:
    - mcp: network
      audience: sre-toolhive:network
      tools: [get_interface_status, get_path_health, get_bgp_status, get_load_balancer_pool]
    - mcp: prometheus
      audience: sre-toolhive:prometheus
      tools: [query_prometheus]
    - mcp: splunk
      audience: sre-toolhive:splunk
      tools: [search_network_logs]
    - mcp: wiki
      audience: sre-toolhive:wiki
      tools: [wiki_search, wiki_read_page]
  execution: { maxToolCalls: 6, maxModelTurns: 6, timeoutMs: 120000, maxEvidenceBytes: 262144, maxContextTokens: 12000, maxEvidenceItems: 32, maxRawExcerptBytes: 8192 }
  discovery: { allowedNeedsDomains: [openshift, active-directory] }
  authorization: { requiredRoles: [network-read] }
  security: { readOnly: true }
