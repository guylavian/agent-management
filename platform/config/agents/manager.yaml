apiVersion: sre.ai/v1alpha1
kind: Agent
metadata:
  name: manager
  owner: sre-platform
  description: "Orchestrator agent that routes user requests to specialist agents and synthesizes their findings."
spec:
  type: manager
  model: { tier: small, profile: manager-router }
  prompt: { systemFile: config/prompts/manager.md }
  execution: { maxAgentsPerRequest: 3, maxRounds: 1, timeoutMs: 1500 }
  output: { schema: ManagerDecision }
