apiVersion: sre.ai/v1alpha1
kind: Agent
metadata:
  name: guy
  owner: guy
  description: "guy"
  displayName: guy
spec:
  type: specialist
  lifecycle: draft
  model: { tier: small, profile: tool-caller }
  prompt: { systemFile: config/prompts/guy.md }
  identity: { provider: keycloak, clientId: sre-agent-guy }
  environments: ["prod", "dr", "lab"]
  routing:
    capabilities: ["jhknm"]
    exclusions: ["jkbhnm"]
  access:
    - mcp: active-directory
      audience: sre-toolhive:active-directory
      tools: [get_replication_status, get_dc_health, list_domain_controllers, get_dns_health]
  execution: { maxToolCalls: 6, maxModelTurns: 6, timeoutMs: 120000, maxEvidenceBytes: 262144, maxContextTokens: 12000, maxEvidenceItems: 32, maxRawExcerptBytes: 8192 }
  discovery: { allowedNeedsDomains: [kjbhnm] }
  authorization: { requiredRoles: [infra-read] }
  security: { readOnly: true }
