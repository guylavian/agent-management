apiVersion: sre.ai/v1alpha1
kind: Agent
metadata:
  name: openshift
  owner: paas
  description: "OpenShift clusters, namespaces, pods, workloads, routes, and platform events"
  displayName: OpenShift Agent
spec:
  type: specialist
  lifecycle: active
  model: { tier: small, profile: tool-caller }
  prompt: { systemFile: config/prompts/openshift.md }
  identity: { provider: keycloak, clientId: sre-agent-openshift }
  environments: ["prod", "dr", "lab"]
  routing:
    capabilities: ["pod/namespace/route/workload health", "platform events", "OpenShift ingress"]
    exclusions: ["identity/authentication", "physical network devices"]
  access:
    - mcp: openshift
      audience: sre-toolhive:openshift
      tools: [get_pod_status, list_namespace_events, get_route_status, get_deployment_status]
    - mcp: kubernetes
      audience: sre-toolhive:kubernetes
      tools: [pods_list, pods_get, pods_log, pods_top, events_list, namespaces_list, nodes_top, resources_list, resources_get]
    - mcp: prometheus
      audience: sre-toolhive:prometheus
      tools: [query_cluster_metrics]
    - mcp: splunk
      audience: sre-toolhive:splunk
      tools: [search_platform_logs]
    - mcp: wiki
      audience: sre-toolhive:wiki
      tools: [wiki_search, wiki_read_page]
  execution: { maxToolCalls: 6, maxModelTurns: 6, timeoutMs: 120000, maxEvidenceBytes: 262144, maxContextTokens: 12000, maxEvidenceItems: 32, maxRawExcerptBytes: 8192 }
  discovery: { allowedNeedsDomains: [network-observability] }
  authorization: { requiredRoles: [infra-read] }
  security: { readOnly: true }
