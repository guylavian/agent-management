apiVersion: sre.ai/v1alpha1
kind: Agent
metadata:
  name: active-directory
  owner: domain-services
  description: "Active Directory, LDAP, Kerberos, domain controllers, AD replication, and AD-integrated DNS."
  displayName: Active Directory Agent
spec:
  type: specialist
  lifecycle: active
  model: { tier: small, profile: tool-caller }
  prompt: { systemFile: config/prompts/active-directory.md }
  identity: { provider: keycloak, clientId: sre-agent-active-directory }
  environments: ["prod", "dr", "lab"]
  routing:
    exactTerms: ["active directory", "domain controller", "domain controllers", "kerberos", "ldap", "ad replication"]
    entityPatterns: ["\\bDC-[A-Z0-9-]+\\b"]
    ambiguousTerms: ["replication", "policy", "certificate", "cluster"]
    capabilities: ["AD replication and domain-controller health", "Kerberos/LDAP authentication", "AD-integrated DNS"]
    exclusions: ["Keycloak configuration", "Prometheus observability", "OpenShift workloads"]
  access:
    - mcp: active-directory
      audience: sre-toolhive:active-directory
      tools: [get_replication_status, get_dc_health, list_domain_controllers, get_dns_health]
    - mcp: splunk
      audience: sre-toolhive:splunk
      tools: [search_ad_events]
    - mcp: prometheus
      audience: sre-toolhive:prometheus
      tools: [query_ad_metrics]
    - mcp: wiki
      audience: sre-toolhive:wiki
      tools: [wiki_search, wiki_read_page]
  execution: { maxToolCalls: 6, maxModelTurns: 6, timeoutMs: 120000, maxEvidenceBytes: 262144, maxContextTokens: 12000, maxEvidenceItems: 32, maxRawExcerptBytes: 8192 }
  discovery: { allowedNeedsDomains: [network-observability] }
  authorization: { requiredRoles: [infra-read, platform-read] }
  security: { readOnly: true }
