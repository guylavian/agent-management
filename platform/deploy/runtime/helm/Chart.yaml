apiVersion: v2
name: sre-agent-runtime
description: >-
  Generic Agent Runtime chart. One chart deploys any logical agent (manager or
  specialist) of the air-gapped SRE Agent Platform: one runtime image + one
  agent YAML configuration = one independently scaled, isolated Deployment.
  Install one release per agent (sre-agent-manager, sre-agent-active-directory, ...).
type: application
version: 0.2.0
appVersion: 0.2.0
