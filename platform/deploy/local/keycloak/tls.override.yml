# TLS overlay: adds HTTPS (8443) to Keycloak for the Keycloak MCP, which refuses
# cleartext http. Run engineering/tools/gen-keycloak-cert.sh first, then:
#   docker compose -f deploy/local/compose.yaml -f deploy/local/keycloak/tls.override.yml up -d
services:
  keycloak:
    environment:
      KC_HTTPS_CERTIFICATE_FILE: /etc/keycloak-certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/keycloak-certs/tls.key
      # App HTTPS (8443) is required by the Keycloak MCP, but keep the management
      # interface (9000: /health, /metrics) on HTTP so the http probes and the
      # Prometheus http scrape of keycloak:9000 work as configured.
      KC_HTTP_MANAGEMENT_SCHEME: http
    volumes:
      - ./keycloak/certs:/etc/keycloak-certs:ro
      # Local-disk workaround: the Docker VM overlay is full; redirect Keycloak's
      # Quarkus build scratch (/tmp) and its H2 data dir to the host disk so
      # `start-dev` augmentation and the embedded DB can write instead of failing
      # on the full overlay. The realm-import file below is mounted nested inside.
      - ../../.real-poc/kc-tmp:/tmp
      - ../../.real-poc/kc-data:/opt/keycloak/data
    ports:
      - "${KEYCLOAK_HTTPS_PORT:-8443}:8443"
