apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent-portal
  labels:
    app.kubernetes.io/name: sre-agent-portal
    app.kubernetes.io/component: management-plane
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-agent-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-agent-portal
        app.kubernetes.io/component: management-plane
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # the execution plane's read-only API; the portal has no other path to runtime state
            - name: SRE_MANAGEMENT_API_URL
              value: {{ .Values.runtime.managementApiUrl | quote }}
            - name: SRE_PORTAL_OIDC_METADATA_URL
              value: {{ .Values.oidc.metadataUrl | quote }}
            - name: SRE_PORTAL_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            # every credential arrives by secret reference — never from values or Git
            - name: SRE_PORTAL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretRef }}
                  key: client-secret
            - name: SRE_GITOPS_PROVIDER
              value: {{ .Values.gitops.provider | quote }}
            {{- if eq .Values.gitops.provider "github" }}
            - name: SRE_GITOPS_OWNER
              value: {{ .Values.gitops.owner | quote }}
            - name: SRE_GITOPS_REPO
              value: {{ .Values.gitops.repo | quote }}
            - name: SRE_GITOPS_BASE_BRANCH
              value: {{ .Values.gitops.baseBranch | quote }}
            - name: SRE_GITOPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitops.tokenSecretRef }}
                  key: token
            {{- end }}
            - name: POSTGRES_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.connectionSecretRef }}
                  key: connection-string
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
