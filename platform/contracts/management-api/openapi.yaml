openapi: 3.1.0
info:
  title: SRE Agent Platform — management API
  version: 0.1.0
  description: >-
    The NEUTRAL contract between the execution plane, which implements this API
    (runtime-host/src/management), and the management plane, which consumes it
    (portal/plugins/agent-management).

    It lives under contracts/ rather than beside either implementation because
    both sides depend on it and neither owns it. TypeScript types for both sides
    are GENERATED from this file (`npm run gen:management-api`), so the runtime
    and the portal cannot disagree about a shape, and the Backstage Yarn
    workspace never imports TypeScript source from the npm workspace.

    Everything here is a PROJECTION of runtime state. No response carries a
    token, a secret, a raw credential, model reasoning or unredacted tool output,
    and no endpoint mutates running policy: an Agent changes by merging a pull
    request. Every route sits behind the same human authentication as /v1/query.

servers:
  - url: /management

paths:
  /agents:
    get:
      operationId: listAgents
      summary: Every specialist Agent, projected from the canonical configuration.
      responses:
        "200":
          description: Agent summaries.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/AgentSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /prompt-assist:
    post:
      operationId: draftSystemPrompt
      summary: Draft a system prompt from unsaved form context. Stores nothing.
      description: >-
        Returns prompt text for the operator to edit. It saves nothing, proposes
        nothing and opens no pull request, and the generated text is guidance
        only — authorization, tool allowlists and the read-only posture are
        enforced by the runtime against configuration, never by a prompt.

        The request body is projected onto a fixed allowlist of scalars and
        string arrays before it leaves the process, so no credential, token or
        audience can travel with it. The model is the platform `prompt-assist`
        profile, bound per environment, and never the Agent's own profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptAssistRequest" }
      responses:
        "200":
          description: The drafted prompt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [prompt]
                properties:
                  prompt: { type: string }
        "400": { $ref: "#/components/responses/DraftInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "501":
          description: No prompt-assist profile is bound in this environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotConfigured" }

  /manager:
    get:
      operationId: getManager
      summary: The Manager agent, which is not a specialist.
      description: >-
        The Manager is a separate branch of the Agent document union: it holds
        no workload identity and reaches no MCP server, because it never calls a
        tool. It is therefore NOT served under /agents/{id}, which would require
        inventing an identity and an access list it does not have.
      responses:
        "200":
          description: Manager detail including the routing table.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /manager/preview:
    post:
      operationId: previewManagerChange
      summary: Render the Manager change-set. Pure; changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagerDraft" }
      responses:
        "200":
          description: The rendered change-set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePreview" }
        "400": { $ref: "#/components/responses/DraftInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /agents/{id}:
    get:
      operationId: getAgent
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      responses:
        "200":
          description: Agent detail including per-MCP access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{id}/health:
    get:
      operationId: getAgentHealth
      summary: Configured posture, not a live probe.
      description: >-
        Reachability is reported as `unknown` until a probe exists. Reporting
        "healthy" without having asked the Agent would be fabricated telemetry.
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      responses:
        "200":
          description: Configured health posture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHealth" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{id}/metrics:
    get:
      operationId: getAgentMetrics
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      responses:
        "200":
          description: In-process run statistics, or not-configured.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/AgentMetrics" }
                  - { $ref: "#/components/schemas/NotConfigured" }
        "404": { $ref: "#/components/responses/NotFound" }

  /mcp-servers:
    get:
      operationId: listMcpServers
      responses:
        "200":
          description: Approved MCP servers and which Agents may reach them.
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items: { $ref: "#/components/schemas/McpServer" }

  /permissions:
    get:
      operationId: getPermissionMatrix
      responses:
        "200":
          description: Agent × MCP grant matrix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionMatrix" }

  /runs:
    get:
      operationId: listRuns
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Bounded, in-process run history.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/RunSummary" }

  /runs/{id}:
    get:
      operationId: getRun
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One run with its execution graph.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{id}/diagnose:
    post:
      operationId: diagnoseRun
      summary: Read one run's trace with the console-assistance model. Stores nothing.
      description: >-
        Returns a plain-language reading of the execution trace: what the run
        did, the earliest node that explains the outcome, and what to check
        next. It is a READING of the trace, not a new source of truth — it
        re-runs nothing, reaches no tool and widens no policy.

        What leaves the process is the trace the console already renders. That
        is already the allowlist: node values are scalars, evidence nodes carry
        a citation rather than a payload, the question is stored after the same
        redaction the model saw, and the initiator is a hash.

        Nothing is written back onto the run record. A trace holds facts, and
        keeping a model's reading beside them would blur which is which.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The diagnosis.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [diagnosis]
                properties:
                  diagnosis: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: No console-assistance profile is bound in this environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotConfigured" }
        "502":
          description: The model was unavailable or returned nothing usable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotConfigured" }

  /evaluations:
    get:
      operationId: getEvaluations
      responses:
        "200":
          description: Not configured — no evaluation backend is wired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotConfigured" }

  /agents/preview:
    post:
      operationId: previewAgentChange
      summary: Validate a draft and render its canonical YAML. Changes nothing.
      description: >-
        Runs the same schema the runtime loads at startup, so the portal cannot
        preview a file that would fail to load.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentDraft" }
      responses:
        "200":
          description: The change-set that would be proposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePreview" }
        "400": { $ref: "#/components/responses/DraftInvalid" }

  /agents/{id}/prompt/preview:
    post:
      operationId: previewPromptChange
      summary: Render the change-set for a prompt edit. Changes nothing.
      description: >-
        The prompt is its own file, so this touches exactly one file and never
        re-renders the Agent document — which carries routing and capabilities
        the portal does not hold and must not be able to drop.
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt]
              properties:
                prompt: { type: string }
      responses:
        "200":
          description: The change-set that would be proposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePreview" }
        "400": { $ref: "#/components/responses/DraftInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  # There is deliberately NO mutating endpoint on the runtime. The execution
  # plane renders a change-set and never writes one: the pull request is opened
  # by the management plane, so the process that enforces Agent policy cannot
  # also change it, and holds no Git credential.

components:
  parameters:
    AgentId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }

  responses:
    Unauthenticated:
      description: Authentication required or failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    DraftInvalid:
      description: The draft failed validation; no file was generated.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DraftError" }

  schemas:
    ToolClassification:
      type: string
      enum: [read, write, unknown]
      description: A tool absent from the approved catalog is `unknown`, never `read`.

    AgentLifecycle:
      type: string
      enum: [draft, active, disabled, decommissioning, removed]

    ToolView:
      type: object
      additionalProperties: false
      required: [name, classification]
      properties:
        name: { type: string }
        classification: { $ref: "#/components/schemas/ToolClassification" }
        role: { type: string, description: "Keycloak client role representing this grant, when granted." }

    McpAccessView:
      type: object
      additionalProperties: false
      required: [mcp, allowed, allowedTools, blockedTools]
      properties:
        mcp: { type: string }
        allowed: { type: boolean }
        audience: { type: string }
        audienceScope: { type: string }
        allowedTools:
          type: array
          items: { $ref: "#/components/schemas/ToolView" }
        blockedTools:
          type: array
          description: Approved-catalog tools on this MCP the Agent is NOT granted.
          items: { $ref: "#/components/schemas/ToolView" }

    AgentSummary:
      type: object
      additionalProperties: false
      required: [id, displayName, owner, lifecycle, enabled, modelProfile, modelTier, mcpCount, toolCount, workloadClientId, readOnly]
      properties:
        id: { type: string }
        displayName: { type: string }
        description: { type: string, description: "From the Agent document. Optional: an Agent need not carry one." }
        owner: { type: string }
        lifecycle: { $ref: "#/components/schemas/AgentLifecycle" }
        enabled: { type: boolean }
        modelProfile: { type: string, description: Logical profile; the environment binds it to a served model. }
        modelTier: { type: string }
        mcpCount: { type: integer }
        toolCount: { type: integer }
        workloadClientId: { type: string, description: "Derived, never author-supplied." }
        readOnly: { type: boolean }
        avatar: { $ref: "#/components/schemas/AgentAvatar" }

    AgentAvatar:
      type: object
      additionalProperties: false
      description: >-
        Presentation only. `asset` is a path inside the configuration
        repository, never a URL, and the image is served by the runtime from
        Git. An Agent without one renders as initials.
      required: [asset, fit]
      properties:
        asset: { type: string, pattern: "^assets/(agents|icons)/[a-z][a-z0-9-]*\\.(png|jpg|webp)$" }
        fit: { type: string, enum: [cover, contain] }

    AgentIdentityView:
      type: object
      additionalProperties: false
      required: [provider, clientId, authentication, tokenPolicy]
      properties:
        provider: { type: string }
        clientId: { type: string }
        authentication: { type: string }
        tokenPolicy: { type: string }

    AgentDetail:
      type: object
      additionalProperties: false
      description: >-
        Everything the console shows about one Agent. It is also everything the
        portal needs to REBUILD the Agent's document, because editing an Agent
        regenerates that document from this view — so a field missing here is a
        field an edit deletes. A round-trip test asserts the equality.
      required: [id, displayName, owner, lifecycle, enabled, modelProfile, modelTier, mcpCount, toolCount, workloadClientId, readOnly, promptFile, prompt, environments, routing, requiredRoles, crossDomainAllowed, limits, access, identity]
      properties:
        id: { type: string }
        displayName: { type: string }
        description: { type: string }
        owner: { type: string }
        lifecycle: { $ref: "#/components/schemas/AgentLifecycle" }
        environments:
          type: array
          items: { type: string }
        routing: { $ref: "#/components/schemas/AgentDraftRouting" }
        enabled: { type: boolean }
        modelProfile: { type: string }
        modelTier: { type: string }
        mcpCount: { type: integer }
        toolCount: { type: integer }
        workloadClientId: { type: string }
        readOnly: { type: boolean }
        avatar: { $ref: "#/components/schemas/AgentAvatar" }
        promptFile: { type: string }
        prompt: { type: string, description: The system prompt body the runtime loaded, so the console shows what the running Agent is using. }
        requiredRoles:
          type: array
          items: { type: string }
        crossDomainAllowed:
          type: array
          items: { type: string }
        limits:
          type: object
          additionalProperties: { type: number }
        access:
          type: array
          items: { $ref: "#/components/schemas/McpAccessView" }
        identity: { $ref: "#/components/schemas/AgentIdentityView" }

    PromptAssistRequest:
      type: object
      description: >-
        The unsaved form, as the operator currently has it. Only these fields
        are read; anything else in the body is discarded by the projection.
      required: [name]
      properties:
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        owner: { type: string }
        routing: { $ref: "#/components/schemas/AgentDraftRouting" }
        crossDomainAllowed: { type: array, items: { type: string } }
        environments: { type: array, items: { type: string } }
        requiredRoles: { type: array, items: { type: string } }
        access:
          type: array
          items: { $ref: "#/components/schemas/AgentDraftAccess" }
        limits:
          type: object
          additionalProperties: { type: number }
        prompt: { type: string, description: The current prompt, when asking for an improvement rather than a first draft. }

    ManagerDetail:
      type: object
      additionalProperties: false
      description: >-
        The Manager. Deliberately NOT an AgentDetail: it has no workloadClientId,
        no access and no routing vocabulary, because it calls no tool. Like
        AgentDetail, it carries everything needed to rebuild a ManagerDraft, so
        editing cannot silently delete a field the console never displayed.
      required: [id, owner, lifecycle, modelProfile, modelTier, promptFile, prompt, allowed, notRouted, execution, identity]
      properties:
        id: { type: string }
        displayName: { type: string }
        description: { type: string }
        owner: { type: string }
        lifecycle: { $ref: "#/components/schemas/AgentLifecycle" }
        modelProfile: { type: string }
        modelTier: { type: string }
        promptFile: { type: string }
        prompt: { type: string }
        allowed:
          type: array
          description: The routing table — specialists the Manager may dispatch to.
          items: { type: string }
        notRouted:
          type: array
          description: >-
            Specialists that exist but are not routable. Listed rather than
            omitted, so "not shown" and "not reachable" cannot look alike.
          items: { type: string }
        environment:
          type: string
          description: >-
            The deployment environment this runtime serves. Absent when none is
            mounted, so a console can say nothing rather than imply everything
            is deployed.
        notDeployed:
          type: array
          description: >-
            Allowed specialists this environment does not run. Being in the
            routing table is only half of being reachable: the effective catalog
            is the allowlist intersected with what the environment enables, and
            an agent listed here is never offered to the Manager at all.
          items: { type: string }
        execution:
          type: object
          additionalProperties: { type: number }
        identity:
          type: object
          additionalProperties: false
          required: [provider, reason]
          description: Stated, so the console shows no blank where a client id would be.
          properties:
            provider: { type: string, enum: [none] }
            reason: { type: string }

    ManagerDraft:
      type: object
      additionalProperties: false
      description: >-
        What the portal collects to update the Manager. `maxRounds` is absent by
        design: a second Manager loop is a runtime feature, never configuration,
        and the schema pins it to 1.
      required: [allowed, modelProfile, prompt]
      properties:
        allowed:
          type: array
          minItems: 1
          items: { type: string }
        modelProfile: { type: string }
        prompt: { type: string }
        owner: { type: string }
        displayName: { type: string }
        description: { type: string }
        lifecycle: { $ref: "#/components/schemas/AgentLifecycle" }
        promptFile: { type: string }
        execution:
          type: object
          additionalProperties: false
          properties:
            maxAgentsPerRequest: { type: number }
            timeoutMs: { type: number }

    AgentHealth:
      type: object
      additionalProperties: false
      required: [agentId, lifecycle, routable, reachability, reason]
      properties:
        agentId: { type: string }
        lifecycle: { $ref: "#/components/schemas/AgentLifecycle" }
        routable: { type: boolean }
        reachability: { type: string, enum: [unknown] }
        reason: { type: string }

    AgentMetrics:
      type: object
      additionalProperties: false
      required: [agentId, source, requestCount, successRate]
      properties:
        agentId: { type: string }
        source: { type: string }
        requestCount: { type: integer }
        successRate: { type: number }
        p95LatencyMs: { type: number }
        lastActivity: { type: string }

    McpServer:
      type: object
      additionalProperties: false
      required: [id, toolCount, tools, agents, expectedAudience, audienceScope, readOnlyVerified]
      properties:
        id: { type: string }
        toolCount: { type: integer }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolView" }
        agents:
          type: array
          description: Agents whose canonical policy grants them this MCP.
          items: { type: string }
        expectedAudience: { type: string }
        audienceScope: { type: string }
        readOnlyVerified: { type: boolean, description: True only when every approved tool on the server is read-only-verified. }
        toolhiveEndpoint: { type: string }

    PermissionCell:
      type: object
      additionalProperties: false
      required: [agent, mcp, allowed, toolCount]
      properties:
        agent: { type: string }
        mcp: { type: string }
        allowed: { type: boolean }
        toolCount: { type: integer }

    PermissionRow:
      type: object
      additionalProperties: false
      required: [agent, cells]
      properties:
        agent: { type: string }
        cells:
          type: array
          items: { $ref: "#/components/schemas/PermissionCell" }

    PermissionMatrix:
      type: object
      additionalProperties: false
      required: [mcps, rows]
      properties:
        mcps:
          type: array
          items: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/PermissionRow" }

    RunSummary:
      type: object
      additionalProperties: false
      required: [requestId, startedAt, durationMs, status, userSubjectHash, agents, toolCalls, evidenceCount]
      properties:
        requestId: { type: string }
        startedAt: { type: string }
        durationMs: { type: integer }
        status: { type: string, enum: [complete, partial, failed] }
        question: { type: string, description: The question after redaction, as the model saw it. }
        userSubjectHash: { type: string, description: Hashed initiator; a raw subject never leaves the runtime. }
        agents:
          type: array
          items: { type: string }
        toolCalls: { type: integer }
        evidenceCount: { type: integer }

    RunNode:
      type: object
      description: >-
        One event in a run's execution trace. Events record intent
        (tool.request), enforcement (authorization.check) and execution
        (toolhive.call) as separate nodes, so a refused attempt is
        distinguishable from one that was never made.
      additionalProperties: false
      required: [id, kind, label, status, startedAt, durationMs, actor]
      properties:
        id: { type: string }
        kind:
          type: string
          description: >-
            The trailing values name capabilities the platform does not have
            yet; they are declared so adding one is an emission rather than a
            contract change.
          enum:
            [user.request, manager.route, followup.route, run.completed,
             specialist, agent.action, agent.result, domain.escalation,
             authorization.check, workload.token,
             tool.request, toolhive.call, evidence, synthesis, error,
             approval.requested, approval.granted, write.action, retry, verify.result]
        label: { type: string }
        parentId: { type: string }
        status: { type: string, enum: [ok, denied, failed, timeout] }
        startedAt: { type: string }
        durationMs: { type: integer }
        actor: { type: string, enum: [user, manager, specialist, runtime] }
        detail: { type: string, description: The substance of the step - a task, a rationale, a refusal reason. }
        agentId: { type: string }
        mcp: { type: string }
        tool: { type: string }
        round: { type: integer, description: Which bounded round produced this node. }
        metadata:
          type: object
          description: Event-specific facts. Scalars only, so no payload can be carried here.
          additionalProperties:
            oneOf: [{ type: string }, { type: number }, { type: boolean }]

    RunDetail:
      type: object
      additionalProperties: false
      required: [requestId, startedAt, durationMs, status, userSubjectHash, environment, agents, workloads, toolCalls, deniedToolCalls, evidenceCount, modelProfiles, nodes]
      properties:
        requestId: { type: string }
        startedAt: { type: string }
        durationMs: { type: integer }
        status: { type: string, enum: [complete, partial, failed] }
        question: { type: string, description: The question after redaction, as the model saw it. }
        userSubjectHash: { type: string }
        environment: { type: string }
        agents:
          type: array
          items: { type: string }
        workloads:
          type: array
          description: Workload client ids that actually executed.
          items: { type: string }
        toolCalls: { type: integer }
        deniedToolCalls: { type: integer }
        evidenceCount: { type: integer }
        modelProfiles:
          type: array
          items: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/RunNode" }

    AgentDraftAccess:
      type: object
      additionalProperties: false
      required: [mcp, tools]
      properties:
        mcp: { type: string }
        tools:
          type: array
          items: { type: string }

    AgentDraftRouting:
      type: object
      additionalProperties: false
      description: >-
        What the Manager reads to decide, semantically, whether this specialist
        should handle a request. It is description, not a lexicon: no code
        matches these strings against a question.
      properties:
        capabilities: { type: array, items: { type: string } }
        exclusions: { type: array, items: { type: string } }

    AgentDraft:
      type: object
      additionalProperties: false
      description: >-
        What the portal collects to create or update an Agent. The workload
        client id and every ToolHive audience are DERIVED from the name, never
        supplied, so the portal cannot grant an Agent another Agent's identity.
      required: [name, owner, modelTier, modelProfile, requiredRoles, access]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
        owner: { type: string }
        displayName: { type: string }
        description: { type: string }
        lifecycle: { $ref: "#/components/schemas/AgentLifecycle" }
        modelTier: { type: string, enum: [small, large] }
        modelProfile: { type: string }
        promptFile: { type: string }
        prompt: { type: string, description: The system prompt body; persisted to config/prompts/<name>.md. }
        environments: { type: array, items: { type: string } }
        routing: { $ref: "#/components/schemas/AgentDraftRouting" }
        requiredRoles: { type: array, items: { type: string } }
        crossDomainAllowed: { type: array, items: { type: string } }
        access:
          type: array
          items: { $ref: "#/components/schemas/AgentDraftAccess" }
        limits:
          type: object
          additionalProperties: { type: number }
        avatar:
          nullable: true
          description: >-
            Omitted leaves the current avatar alone, null removes it, an object
            sets it — either to an asset already in the repository or to a new
            upload whose bytes join the same change-set.
          type: object
          additionalProperties: false
          properties:
            asset: { type: string }
            upload: { type: string, description: base64 image bytes, validated by the runtime. }
            fit: { type: string, enum: [cover, contain] }

    DiffLine:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: { type: string, enum: [context, add, remove] }
        before: { type: integer, description: Line number in the file before the change; absent on an addition. }
        after: { type: integer, description: Line number in the file after the change; absent on a removal. }
        text: { type: string }

    DiffHunk:
      type: object
      additionalProperties: false
      required: [beforeStart, beforeLines, afterStart, afterLines, header, lines]
      properties:
        beforeStart: { type: integer }
        beforeLines: { type: integer }
        afterStart: { type: integer }
        afterLines: { type: integer }
        header: { type: string, description: "Git-style @@ -a,b +c,d @@." }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DiffLine" }

    FileDiff:
      type: object
      additionalProperties: false
      description: >-
        One file in a change-set, compared against what is currently on disk.
        Computed by the runtime, which is the only process that can see the
        working tree; the portal renders it and computes nothing.
      required: [path, status, additions, deletions, hunks, binary]
      properties:
        path: { type: string }
        status: { type: string, enum: [added, modified, deleted, unchanged] }
        additions: { type: integer }
        deletions: { type: integer }
        hunks:
          type: array
          items: { $ref: "#/components/schemas/DiffHunk" }
        binary: { type: boolean, description: No line diff is meaningful; the file is still part of the change. }

    ChangeSetDiff:
      type: object
      additionalProperties: false
      required: [files, additions, deletions, changed]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/FileDiff" }
        additions: { type: integer }
        deletions: { type: integer }
        changed: { type: integer, description: Files that actually changed; an unchanged file is listed but not counted. }

    ChangedFile:
      type: object
      additionalProperties: false
      required: [path, contents]
      properties:
        path: { type: string }
        contents: { type: string }
        encoding: { type: string, enum: [base64], description: Present when contents carries bytes rather than text. }

    ChangePreview:
      type: object
      additionalProperties: false
      required: [path, yaml, branch, title, body, effects, files]
      properties:
        path: { type: string, description: Path of the canonical Agent document. }
        yaml: { type: string }
        branch: { type: string }
        title: { type: string }
        body: { type: string, description: "Pull-request description, rendered by the runtime for the management plane to publish." }
        effects:
          type: array
          items: { type: string }
        files:
          type: array
          description: Every file in the change-set — Agent, prompt and deployment overlay.
          items: { $ref: "#/components/schemas/ChangedFile" }
        diff: { $ref: "#/components/schemas/ChangeSetDiff" }

    ChangeResult:
      type: object
      additionalProperties: false
      description: >-
        Outcome of publishing a change-set. Produced by the MANAGEMENT plane,
        which owns the Git credential; the runtime never returns one.
      required: [status, branch, effects]
      properties:
        status: { type: string, enum: [created, not-configured] }
        url: { type: string }
        reason: { type: string }
        branch: { type: string }
        effects:
          type: array
          items: { type: string }

    NotConfigured:
      type: object
      additionalProperties: false
      description: Answered when a deployment has no backend wired, instead of inventing numbers.
      required: [status, reason]
      properties:
        status: { type: string, enum: [not-configured] }
        reason: { type: string }

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }

    DraftError:
      type: object
      additionalProperties: false
      required: [code, message, issues]
      properties:
        code: { type: string, enum: [AGENT_DRAFT_INVALID] }
        message: { type: string }
        issues:
          type: array
          items: { type: string }
