<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Backstage is an open source framework for building developer portals"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link
      rel="manifest"
      href="<%= publicPath %>/manifest.json"
      crossorigin="use-credentials"
    />
    <link rel="icon" href="<%= publicPath %>/favicon.ico" />
    <link rel="shortcut icon" href="<%= publicPath %>/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= publicPath %>/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= publicPath %>/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= publicPath %>/favicon-16x16.png"
    />
    <link
      rel="mask-icon"
      href="<%= publicPath %>/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <title><%= config.getOptionalString('app.title') ?? 'Backstage' %></title>
    <!--
      NO WEBFONT, and no preconnect to one. This portal is deployed into
      clusters with no route to the public internet, where a hosted stylesheet
      does not fail loudly — it hangs until the browser gives up, so first paint
      is delayed on every page load for every operator and nothing in the
      cluster reports why. It also tells a third party who is opening an
      internal console. The stack below is resolved by the operating system.
    -->
    <style>
      /* product canvas; the plugin draws its own surfaces on top */
      html, body { margin: 0; padding: 0; background: #f7f8fa; }
      * { box-sizing: border-box; }
      ::placeholder { color: #7a828c; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
      /* the product sidebar is a fixed 222px rail; offset Backstage's page root */
      [class*='BackstageSidebarPage'] { padding-left: 244px; min-height: 100vh; }
      /* The OS UI font, which every platform already has; form controls do not
         inherit font by default. Figtree stays first so a deployment that
         self-hosts it still gets it. */
      body { font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      input, select, textarea, button { font-family: inherit; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `yarn start`.
      To create a production bundle, use `yarn build`.
    -->
  </body>
</html>
