when:
  - event: [push, pull_request]

steps:
  install:
    image: node:24-alpine
    commands:
      - npm ci

  # The one command that validates the repository: typecheck, lint, the
  # architectural boundary check, tests, YAML validation, generated-artifact
  # freshness and Helm lint/render.
  check:
    image: node:24-alpine
    commands:
      - apk add --no-cache git helm
      - npm run check

  # Generated artifacts are committed AND verified. `check:generated` re-runs
  # every generator and fails on any diff, so a stale JSON Schema, a stale
  # package inventory or a rendered Agent that no longer matches its source
  # cannot reach main. This matters most for the air-gapped model, where the
  # committed render is what actually ships.
  portal:
    image: node:24
    commands:
      - corepack enable
      - cd portal && yarn install --immutable && yarn tsc
