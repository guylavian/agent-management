when:
  - event: [push, pull_request]

# The Git root holds directories only, and three of them are first-class
# concerns: agent-engine/ (the generic engine), platform/ (the SRE platform
# built on it) and deploy/ (how they are packaged). agent-engine is its own npm
# project, so `npm run check` in platform/ delegates into it rather than the two
# being separate CI concerns.
steps:
  check:
    image: node:24-alpine
    directory: platform
    commands:
      - apk add --no-cache git helm
      - npm ci
      - npm --prefix ../agent-engine ci
      # typecheck, lint, boundaries, tests (platform + engine), YAML validation,
      # generated-artifact freshness and Helm lint/render.
      #
      # Generated artifacts are committed AND verified: `check:generated` re-runs
      # every generator and fails on any diff, so a stale JSON Schema, a stale
      # package inventory or a rendered Agent that no longer matches its source
      # cannot reach main. That matters most for the air-gapped model, where the
      # committed render is what actually ships.
      - npm run check

  # Backstage is a separate Yarn workspace on its own toolchain, deliberately not
  # folded into the npm root, so it is checked on its own terms.
  portal:
    image: node:24
    directory: platform/management/portal
    commands:
      - corepack enable
      - yarn install --immutable
      - yarn tsc
      - yarn lint:all
      - yarn test --watch=false
