when:
  - event: [push, pull_request]

# The Git root is a repository shell holding directories only. The software is
# one npm workspace rooted at platform/, so every step runs from there.
steps:
  check:
    image: node:24-alpine
    directory: platform
    commands:
      - apk add --no-cache git helm
      - npm ci
      # The one command that validates the repository: typecheck, lint, the
      # architectural boundary check, tests, YAML validation, generated-artifact
      # freshness and Helm lint/render.
      #
      # Generated artifacts are committed AND verified: `check:generated` re-runs
      # every generator and fails on any diff, so a stale JSON Schema, a stale
      # package inventory or a rendered Agent that no longer matches its source
      # cannot reach main. That matters most for the air-gapped model, where the
      # committed render is what actually ships.
      - npm run check

  # Backstage is a separate Yarn workspace on its own toolchain, deliberately not
  # folded into the npm root, so it is checked on its own terms.
  portal:
    image: node:24
    directory: platform/management/portal
    commands:
      - corepack enable
      - yarn install --immutable
      - yarn tsc
      - yarn lint:all
      - yarn test --watch=false
