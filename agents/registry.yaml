apiVersion: sre.ai/v1alpha1
kind: AgentServiceRegistry
agents:
  - agentId: active-directory
    endpoint: http://sre-agent-active-directory.sre-assistant.svc.cluster.local
    owner: domain-services
    description: Active Directory, LDAP, Kerberos, domain controllers, AD replication, and AD-integrated DNS.
    enabled: true
    environments: [prod, dr, lab]
    requiredRoles: [infra-read]
    allowedNeedsDomains: [network-observability]
    routing:
      exactTerms: ["active directory", "domain controller", "domain controllers", "kerberos", "ldap", "ad replication"]
      entityPatterns: ["\\bDC-[A-Z0-9-]+\\b"]
      ambiguousTerms: ["replication", "policy", "certificate", "cluster"]
      capabilities: ["AD replication and domain-controller health", "Kerberos/LDAP authentication", "AD-integrated DNS"]
      exclusions: ["Keycloak configuration", "Prometheus observability", "OpenShift workloads"]
  - agentId: openshift
    endpoint: http://sre-agent-openshift.sre-assistant.svc.cluster.local
    owner: paas
    description: OpenShift clusters, namespaces, pods, workloads, routes, and platform events
    enabled: true
    environments: [prod, dr, lab]
    requiredRoles: [infra-read]
    allowedNeedsDomains: [network-observability]
    routing:
      exactTerms: ["openshift", "crashloopbackoff", "ocp", "kubernetes pod"]
      entityPatterns: ["\\bnamespace\\s+[a-z0-9-]+\\b", "\\bOCP-[A-Z0-9-]+\\b"]
      ambiguousTerms: ["cluster", "node", "policy"]
      capabilities: ["pod/namespace/route/workload health", "platform events", "OpenShift ingress"]
      exclusions: ["identity/authentication", "physical network devices"]
  - agentId: network-observability
    endpoint: http://sre-agent-network-observability.sre-assistant.svc.cluster.local
    owner: network-observability
    description: Network paths, interfaces, load balancers, Prometheus, Splunk, and observability
    enabled: true
    environments: [prod, dr, lab]
    requiredRoles: [network-read]
    allowedNeedsDomains: [openshift, active-directory]
    routing:
      exactTerms: ["packet loss", "bgp", "interface errors", "interface error", "splunk", "network latency"]
      entityPatterns: []
      ambiguousTerms: ["gateway", "policy", "latency"]
      capabilities: ["connectivity/latency/packet-loss", "Splunk network queries", "network-path evidence"]
      exclusions: ["identity/authentication", "OpenShift workload internals"]
  - agentId: keycloak
    endpoint: http://sre-agent-keycloak.sre-assistant.svc.cluster.local
    owner: identity-platform
    description: Keycloak identity and authentication specialist for realms, users, clients, roles, groups, flows, sessions, identity providers and configuration.
    enabled: true
    environments: [prod, dr, lab]
    requiredRoles: [infra-read]
    allowedNeedsDomains: [observability]
    routing:
      exactTerms: ["keycloak realm", "sre-test realm", "realm", "realms", "keycloak client", "clients exist", "authentication flow", "authentication flows", "identity provider", "identity providers", "keycloak configuration", "login failure", "login failures"]
      entityPatterns: ["\\bsre-test-(?:user|client|role)\\b"]
      ambiguousTerms: ["authentication", "login", "client", "role", "group", "session"]
      capabilities: ["Keycloak realms/users/clients/roles/groups", "authentication flows and sessions", "identity providers and login configuration"]
      exclusions: ["Prometheus metrics", "general infrastructure observability", "Active Directory administration"]
  - agentId: observability
    endpoint: http://sre-agent-observability.sre-assistant.svc.cluster.local
    owner: sre-observability
    description: Prometheus-based availability, latency, error, runtime-health and time-series investigation.
    enabled: true
    environments: [prod, dr, lab]
    requiredRoles: [infra-read]
    allowedNeedsDomains: [keycloak]
    routing:
      exactTerms: ["keycloak healthy", "prometheus", "promql", "service health", "runtime health", "runtime problem", "availability", "time series", "last 15 minutes"]
      entityPatterns: []
      ambiguousTerms: ["healthy", "latency", "errors", "failing"]
      capabilities: ["Prometheus metrics and target availability", "latency/error signals", "runtime and service health over time"]
      exclusions: ["Keycloak configuration", "identity administration", "write operations"]
