apiVersion: sre.ai/v1alpha1
kind: Agent
metadata:
  name: wiki
  owner: sre-platform
spec:
  type: specialist
  model: { tier: small, profile: tool-caller }
  prompt: { systemFile: prompts/wiki.md }
  # knowledge comes from the LLM Wiki MCP, not the platform RAG service
  rag: { enabled: false, collections: [none], baselineRetrieval: false, maxFollowupRetrievals: 0, topK: 1 }
  mcp:
    servers: [wiki]
    # read-only tools only; wiki_ask is excluded because it can write when file_back=true
    allowedTools: [wiki_search, wiki_read_page, wiki_route]
  execution: { maxToolCalls: 5, maxModelTurns: 3, timeoutMs: 45000, maxEvidenceBytes: 262144, maxContextTokens: 12000, maxEvidenceItems: 24, maxRawExcerptBytes: 8192 }
  authorization: { requiredRoles: [infra-read] }
