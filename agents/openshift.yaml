apiVersion: sre.ai/v1alpha1
kind: Agent
metadata:
  name: openshift
  owner: paas
spec:
  type: specialist
  model: { tier: small, profile: tool-caller }
  prompt: { systemFile: prompts/openshift.md }
  rag: { enabled: true, collections: [openshift-wiki], baselineRetrieval: true, maxFollowupRetrievals: 1, topK: 8 }
  mcp:
    servers: [openshift, prometheus, splunk, wiki]
    allowedTools: [get_pod_status, list_namespace_events, get_route_status, get_deployment_status, query_cluster_metrics, search_platform_logs, wiki_search, wiki_read_page]
  execution: { maxToolCalls: 6, maxModelTurns: 3, timeoutMs: 25000, maxEvidenceBytes: 262144, maxContextTokens: 12000, maxEvidenceItems: 32, maxRawExcerptBytes: 8192 }
  discovery: { allowedNeedsDomains: [network-observability] }
  authorization: { requiredRoles: [infra-read] }
