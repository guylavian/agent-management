apiVersion: v1
kind: Service
metadata:
  # Service DNS must equal the endpoint in agents/registry.yaml:
  # http://sre-agent-<name>.<namespace>.svc.cluster.local
  name: {{ include "sre-agent.fullname" . }}
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  selector: {{- include "sre-agent.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sre-agent.fullname" . }}
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
{{- if .Values.agent.configOverride }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-agent.fullname" . }}-config
  labels: {{- include "sre-agent.labels" . | nindent 4 }}
data:
  agent.yaml: |
{{ .Values.agent.configOverride | indent 4 }}
{{- end }}
